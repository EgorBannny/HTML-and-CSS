<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Практикум — HTML и CSS</title>
<style>
/* Самостоятельный учебный тренажёр. Все стили, данные и скрипты встроены. */
:root { color-scheme:light; --bg:#f5f6f2; --surface:#fff; --soft:#eef1eb; --text:#202b24; --muted:#59675e; --line:#d9e0d7; --accent:#28553e; --accentText:#fff; --good:#1c6840; --goodBg:#e8f5eb; --bad:#a33333; --badBg:#fff0ee; --focus:#b95a17; --shadow:0 8px 30px #1c352509; }
[data-theme="dark"] { color-scheme:dark; --bg:#151c18; --surface:#1e2822; --soft:#27342b; --text:#eef2e9; --muted:#b2c1b5; --line:#405045; --accent:#b3d8ad; --accentText:#183122; --good:#b7e7c2; --goodBg:#203c2d; --bad:#ffb8b3; --badBg:#482a29; --focus:#f5bd83; --shadow:none; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif; }
button,input,select { font:inherit; }
button,select,label,input[type="checkbox"] { touch-action:manipulation; }
button,a,input,select { -webkit-tap-highlight-color:transparent; }
button { cursor:pointer; }
button:disabled { cursor:default; opacity:.58; }
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
a { color:var(--accent); text-underline-offset:3px; }
button { color:var(--text); background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 16px; font-weight:600; }
button:hover:not(:disabled) { border-color:var(--accent); }
.primary { background:var(--accent); color:var(--accentText); border-color:var(--accent); }
.small { padding:6px 10px; font-size:.86rem; }
.text-button { border:0; background:transparent; padding:6px 0; text-decoration:underline; text-underline-offset:4px; }
header { border-bottom:1px solid var(--line); background:var(--surface); }
.header-inner { max-width:1180px; margin:auto; padding:17px 28px; display:flex; gap:24px; align-items:center; flex-wrap:wrap; }
.brand { display:flex; align-items:center; gap:12px; margin-right:auto; font-weight:750; letter-spacing:-.4px; }
.brand-mark { background:var(--accent); color:var(--accentText); width:38px; height:38px; display:grid; place-items:center; border-radius:10px; font:700 18px ui-monospace,monospace; }
.header-note { color:var(--muted); font-size:.82rem; font-weight:450; letter-spacing:0; }
nav { display:flex; gap:6px; }
nav button { background:none; border-color:transparent; padding:8px 12px; font-size:.9rem; }
nav button[aria-current="page"] { background:var(--soft); }
main { max-width:1180px; padding:38px 28px 64px; margin:auto; }
h1,h2,h3,p { margin:0; }
h1 { font-size:clamp(2rem,4vw,3.15rem); letter-spacing:-1.7px; line-height:1.16; font-weight:650; }
h2 { font-size:1.3rem; line-height:1.4; letter-spacing:-.4px; }
h3 { font-size:1rem; }
.lead { color:var(--muted); max-width:710px; margin-top:18px; }
.eyebrow { color:var(--accent); font:650 .76rem/1.5 ui-monospace,monospace; letter-spacing:1.3px; text-transform:uppercase; margin-bottom:13px; }
.hero { padding:8px 0 30px; display:flex; justify-content:space-between; align-items:flex-start; gap:24px; }
.hero-aside { min-width:145px; border-left:1px solid var(--line); padding:0 0 0 24px; margin-top:8px; color:var(--muted); font-size:.85rem; }
.hero-aside strong { display:block; color:var(--text); font-size:2.5rem; line-height:1.2; font-weight:600; }
.stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:28px; }
.stat { padding:17px 20px; background:var(--surface); border:1px solid var(--line); border-radius:12px; }
.stat strong { display:block; font-size:1.65rem; line-height:1.35; }
.stat span { color:var(--muted); font-size:.85rem; }
.grid { display:grid; grid-template-columns:minmax(0,1fr) 310px; gap:24px; align-items:start; }
.panel { padding:26px; background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); }
.panel + .panel { margin-top:18px; }
.panel-title { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:21px; }
.muted { color:var(--muted); }
.tiny { font-size:.82rem; }
.field-label { display:block; font-size:.86rem; font-weight:650; margin-bottom:8px; }
.segment { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:20px; }
.segment button { font-size:.9rem; }
.segment button.active { background:var(--accent); color:var(--accentText); border-color:var(--accent); }
.form-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-top:18px; }
select,input[type="search"] { width:100%; border:1px solid var(--line); background:var(--surface); color:var(--text); padding:10px 11px; border-radius:9px; min-width:0; }
.topic-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px 13px; margin:12px 0; }
.topic { display:flex; align-items:start; gap:8px; font-size:.84rem; padding:6px 0; cursor:pointer; }
.topic input { width:17px; height:17px; flex:none; margin:4px 0 0; accent-color:var(--accent); }
.topic span { flex:1; }
.topic b { font-size:.76rem; color:var(--muted); font-weight:500; }
.topic-group { margin-top:15px; padding-top:15px; border-top:1px solid var(--line); }
.actions { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:22px; }
.actions .primary { padding:12px 22px; }
.info-list { padding-left:20px; margin:14px 0 0; color:var(--muted); font-size:.9rem; }
.info-list li+li { margin-top:9px; }
.note { font-size:.85rem; color:var(--muted); margin-top:16px; }
.notice { padding:12px 16px; margin-bottom:20px; border:1px solid var(--bad); border-radius:10px; background:var(--badBg); }
.resume { padding:18px 22px; border:1px solid var(--accent); border-radius:12px; margin-bottom:24px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; background:var(--soft); }
.quiz-shell { display:grid; grid-template-columns:minmax(0,1fr) 250px; gap:24px; align-items:start; }
.quiz-top { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
.progress { height:5px; border-radius:5px; background:var(--line); overflow:hidden; margin-bottom:26px; }
.progress > div { height:100%; background:var(--accent); transition:width .2s; }
.tags { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:18px; }
.tag { border:1px solid var(--line); border-radius:6px; padding:2px 8px; color:var(--muted); font-size:.75rem; }
.tag.subject { background:var(--soft); border-color:transparent; color:var(--accent); font-weight:700; }
.question-title { font-size:clamp(1.2rem,2.5vw,1.55rem); line-height:1.48; letter-spacing:-.35px; margin-bottom:20px; }
pre { background:var(--soft); padding:17px; border-radius:10px; border:1px solid var(--line); overflow:auto; font: .86rem/1.7 ui-monospace,SFMono-Regular,Consolas,monospace; margin:14px 0 20px; tab-size:2; }
code { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; }
.options { display:grid; gap:10px; margin:20px 0; }
.option { display:flex; align-items:start; gap:13px; text-align:left; border-radius:11px; padding:15px; width:100%; background:var(--surface); font-weight:450; line-height:1.6; overflow-wrap:anywhere; }
.option:disabled { opacity:1; }
.option-key { flex:none; width:29px; height:29px; display:grid; place-items:center; border:1px solid var(--line); border-radius:7px; font-size:.8rem; font-family:ui-monospace,monospace; }
.option.selected { border-color:var(--accent); background:var(--soft); }
.option.good { border-color:var(--good); background:var(--goodBg); }
.option.bad { border-color:var(--bad); background:var(--badBg); }
.option-status { display:block; font-size:.78rem; font-weight:700; color:var(--good); margin-top:5px; }
.bad .option-status { color:var(--bad); }
.feedback { border-top:1px solid var(--line); padding-top:23px; margin-top:22px; }
.feedback h3 { font-size:1.1rem; margin-bottom:10px; }
.feedback.good h3 { color:var(--good); }
.feedback.bad h3 { color:var(--bad); }
.feedback p { margin:10px 0; }
.feedback .answer-line { font-size:.88rem; }
.quiz-footer { display:flex; align-items:center; gap:10px; justify-content:space-between; flex-wrap:wrap; margin-top:20px; }
.map { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; margin-top:17px; }
.map button { padding:7px 0; font-size:.78rem; border-radius:6px; }
.map button.current { outline:2px solid var(--accent); outline-offset:1px; }
.map button.right { background:var(--goodBg); border-color:var(--good); color:var(--good); }
.map button.wrong { background:var(--badBg); border-color:var(--bad); color:var(--bad); }
.legend { display:flex; gap:9px; margin-top:13px; font-size:.75rem; color:var(--muted); flex-wrap:wrap; }
.right-text { color:var(--good); }.wrong-text { color:var(--bad); }
.legend em { font-style:normal; }
.inline-check { display:flex; gap:8px; align-items:center; font-size:.87rem; margin-top:15px; }
.inline-check input { width:17px; height:17px; accent-color:var(--accent); }
.empty { padding:34px; text-align:center; border:1px dashed var(--line); border-radius:12px; color:var(--muted); }
.library-controls { display:grid; grid-template-columns:2fr 1fr 1fr; gap:12px; margin:23px 0; }
.library-item { margin-bottom:14px; }
.library-item h2 { font-size:1.08rem; letter-spacing:0; }
.library-item summary { cursor:pointer; font-weight:650; }
.library-item summary::marker { color:var(--muted); }
.library-item .tags { margin-bottom:10px; }
.library-item .entry-body { padding-top:16px; }
.library-item p { margin:10px 0; }
.table-wrap { overflow-x:auto; margin-top:20px; }
table { width:100%; border-collapse:collapse; text-align:left; font-size:.9rem; }
th,td { padding:13px 10px; border-bottom:1px solid var(--line); }
th { color:var(--muted); font-weight:600; }
.result-number { font-size:clamp(3rem,7vw,5rem); font-weight:600; line-height:1.2; letter-spacing:-3px; margin:12px 0; }
.result-review { margin-top:26px; }
.result-review .library-item { background:var(--surface); }
footer { max-width:1180px; padding:0 28px 28px; margin:auto; font-size:.8rem; color:var(--muted); display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
[hidden] { display:none!important; }
@media(max-width:900px) { .grid { grid-template-columns:minmax(0,1fr); } .grid aside { display:grid; grid-template-columns:1fr 1fr; gap:16px; }.grid aside .panel { margin:0; } .quiz-shell { grid-template-columns:minmax(0,1fr); } .quiz-shell aside { order:2; } .map { grid-template-columns:repeat(10,minmax(0,1fr)); } }
@media(max-width:600px) { .header-inner { padding:14px 16px; gap:12px; }.brand { width:100%; }nav { flex:1; }nav button { padding:7px 9px; }main { padding:25px 16px 40px; }.hero-aside { display:none; }.hero { padding-bottom:23px; }.stats { grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }.stat { padding:13px 15px; }.panel { padding:20px 17px; border-radius:12px; }.form-grid { grid-template-columns:1fr; }.topic-list { grid-template-columns:1fr; gap:2px; }.grid aside { display:block; }.grid aside .panel+.panel { margin-top:16px; }.library-controls { grid-template-columns:1fr; }.quiz-top .muted { font-size:.85rem; }.map { grid-template-columns:repeat(7,minmax(0,1fr)); }.option { padding:12px; gap:10px; }.option-key { width:25px; height:25px; }footer { padding-inline:16px; }.panel-title { align-items:flex-start; }.quiz-footer { align-items:stretch; }.quiz-footer button { flex:1; } }
@media(prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; transition:none!important; } }
@media print { header,footer,button,.actions,.library-controls { display:none!important; } body,main { background:white; color:black; } .panel { box-shadow:none; break-inside:avoid; } details:not([open]) { display:none; } }
</style>
</head>

стройства для viewport?", "options": ["\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">", "\u003cmeta name=\"screen\" content=\"mobile\">", "\u003cmeta name=\"viewport\" content=\"width=1920\">", "\u003cmeta charset=\"viewport\">"], "explanation": "Без корректного viewport мобильный браузер может отрисовывать страницу в широком виртуальном окне и уменьшать её. Это мешает ожидаемой работе адаптивной вёрстки. Сам по себе метатег не заменяет media queries и гибкие размеры.", "code": "", "example": ""}, {"id": "h005", "subject": "HTML", "topic": "Документ и синтаксис", "level": 1, "prompt": "Как правильно подключить файл css/styles.css?", "options": ["\u003clink rel=\"stylesheet\" href=\"css/styles.css\">", "\u003cstyle src=\"css/styles.css\">\u003c/style>", "\u003clink src=\"css/styles.css\">", "\u003cstylesheet href=\"css/styles.css\">"], "explanation": "Внешний CSS подключают элементом link с rel=\"stylesheet\" и адресом в href. Обычно link размещают в head. style предназначен для самого текста CSS и не загружает файл через атрибут src.", "code": "", "example": ""}, {"id": "h006", "subject": "HTML", "topic": "Документ и синтаксис", "level": 1, "prompt": "Как записать комментарий в HTML?", "options": ["\u003c!-- Навигация -->", "/* Навигация */", "// Навигация", "\u003ccomment>Навигация\u003c/comment>"], "explanation": "HTML-комментарий начинается с \u003c!-- и заканчивается -->. CSS использует /* ... */. Комментарии доступны в исходном коде, поэтому не подходят для хранения паролей или других секретов.", "code": "", "example": ""}, {"id": "h007", "subject": "HTML", "topic": "Документ и синтаксис", "level": 1, "prompt": "Какой из элементов является пустым и не имеет закрывающего тега в HTML?", "options": ["img", "textarea", "button", "section"], "explanation": "img — void element: у него нет содержимого и закрывающего тега. К той же категории относятся input, br, meta и link. У textarea и button содержимое находится между открывающим и закрывающим тегами.", "code": "", "example": ""}, {"id": "h008", "subject": "HTML", "topic": "Документ и синтаксис", "level": 1, "prompt": "Как вывести в тексте символы \u003c и >, чтобы они не стали тегом?", "options": ["Использовать &lt; и &gt;", "Использовать \u003cbr> вокруг текста", "Добавить атрибут literal", "Заменить пробелы на &nbsp;"], "explanation": "Символьные ссылки &lt; и &gt; представляют угловые скобки. Для амперсанда используют &amp;. Элемент code задаёт семантику фрагмента кода, но сам по себе не отключает разбор HTML.", "code": "", "example": "\u003ccode>&lt;h1&gt;Заголовок&lt;/h1&gt;\u003c/code>"}, {"id": "h009", "subject": "HTML", "topic": "Документ и синтаксис", "level": 2, "prompt": "Как интерпретируется required=\"false\" у input?", "options": ["Поле остаётся обязательным", "Поле становится необязательным", "Браузер удаляет input из формы", "Поле становится только для чтения"], "explanation": "required — логический атрибут: его присутствие включает требование независимо от строки \"false\". Чтобы отключить его, нужно убрать атрибут. Аналогично работают disabled, checked и multiple.", "code": "", "example": ""}, {"id": "h010", "subject": "HTML", "topic": "Семантика и структура", "level": 1, "prompt": "Какой элемент обозначает основное уникальное содержимое страницы?", "options": ["main", "header", "aside", "nav"], "explanation": "main выделяет главное содержимое, связанное с темой страницы. Повторяющиеся общесайтовые меню и подвал обычно находятся вне него. Для обычной страницы используй один видимый main.", "code": "", "example": ""}, {"id": "h011", "subject": "HTML", "topic": "Семантика и структура", "level": 1, "prompt": "Что лучше подходит для основного меню со ссылками?", "options": ["nav", "article", "figure", "blockquote"], "explanation": "nav обозначает блок навигации по страницам или разделам. Его семантика помогает пользователям вспомогательных технологий находить меню. Не каждую группу ссылок обязательно оборачивать в nav.", "code": "", "example": ""}, {"id": "h012", "subject": "HTML", "topic": "Семантика и структура", "level": 2, "prompt": "Когда article лучше соответствует смыслу блока, чем обычный div?", "options": ["Когда блок является самостоятельной публикацией или карточкой, понятной отдельно", "Когда блоку нужен только красный фон", "Когда внутри ровно одна ссылка", "Когда блок расположен справа"], "explanation": "article подходит для самостоятельного материала: записи, новости, содержательной карточки или комментария. div не добавляет семантического смысла. Выбор элемента определяется ролью содержимого, а не способом его оформления.", "code": "", "example": ""}, {"id": "h013", "subject": "HTML", "topic": "Семантика и структура", "level": 1, "prompt": "Как лучше организовать заголовки главной страницы?", "options": ["h1 для темы страницы, h2 для разделов, h3 для подразделов", "Выбирать h1–h6 только по размеру шрифта", "Заменить все заголовки на жирные div", "Использовать h6 для всех карточек независимо от структуры"], "explanation": "Уровень заголовка отражает структуру документа. Размер и внешний вид меняют CSS, а не выбором случайного уровня. Один понятный h1 и последовательная иерархия — удобная практика для этого проекта.", "code": "", "example": ""}, {"id": "h014", "subject": "HTML", "topic": "Семантика и структура", "level": 2, "prompt": "Что неверно в этом фрагменте?", "options": ["Внутрь p нельзя вкладывать section", "section обязательно должен иметь атрибут href", "p разрешён только в head", "h2 нельзя использовать внутри section"], "explanation": "p содержит фразовый контент. При встрече section браузер закроет p автоматически, и фактическая структура DOM будет отличаться от ожидаемой. Размещай section рядом с абзацем или используй div как общий контейнер.", "code": "\u003cp>Описание\u003csection>\u003ch2>Музеи\u003c/h2>\u003c/section>\u003c/p>", "example": ""}, {"id": "h015", "subject": "HTML", "topic": "Семантика и структура", "level": 1, "prompt": "Какая разметка подходит для списка преимуществ без нумерации?", "options": ["\u003cul>\u003cli>Удобный поиск\u003c/li>\u003cli>Фотографии\u003c/li>\u003c/ul>", "\u003col>\u003cp>Удобный поиск\u003c/p>\u003c/ol>", "\u003clist>\u003citem>Удобный поиск\u003c/item>\u003c/list>", "\u003cul>\u003cdiv>Удобный поиск\u003c/div>\u003c/ul>"], "explanation": "ul задаёт неупорядоченный список, а его пункты оформляют через li. ol нужен для списка, где порядок имеет значение. Маркеры и расположение пунктов можно менять через CSS.", "code": "", "example": ""}, {"id": "h016", "subject": "HTML", "topic": "Ссылки и пути", "level": 1, "prompt": "Как сделать переход к разделу этой же страницы?", "options": ["\u003ca href=\"#popular-section\">Популярное\u003c/a>", "\u003ca src=\"popular-section\">Популярное\u003c/a>", "\u003ca href=\".popular-section\">Популярное\u003c/a>", "\u003ca target=\"popular-section\">Популярное\u003c/a>"], "explanation": "Фрагмент URL после # указывает на id элемента. На странице должен существовать элемент с id=\"popular-section\". Для другой страницы адрес может выглядеть как index.html#popular-section.", "code": "", "example": ""}, {"id": "h017", "subject": "HTML", "topic": "Ссылки и пути", "level": 1, "prompt": "Как оформить кликабельный телефон из задания?", "options": ["\u003ca href=\"tel:+78007654321\">8-800-765-43-21\u003c/a>", "\u003ca href=\"phone:88007654321\">8-800-765-43-21\u003c/a>", "\u003cspan tel=\"88007654321\">8-800-765-43-21\u003c/span>", "\u003ca href=\"#88007654321\">8-800-765-43-21\u003c/a>"], "explanation": "Схема tel: передаёт номер приложению для звонков. Отображаемый текст можно форматировать дефисами, а в адресе удобно использовать международную запись. Само наличие ссылки не гарантирует, что на компьютере установлено приложение звонков.", "code": "", "example": ""}, {"id": "h018", "subject": "HTML", "topic": "Ссылки и пути", "level": 1, "prompt": "Как оформить ссылку на электронную почту?", "options": ["\u003ca href=\"mailto:info@orenlandmarks.ru\">Написать\u003c/a>", "\u003ca href=\"email:info@orenlandmarks.ru\">Написать\u003c/a>", "\u003ca src=\"info@orenlandmarks.ru\">Написать\u003c/a>", "\u003cmail href=\"info@orenlandmarks.ru\">Написать\u003c/mail>"], "explanation": "mailto: открывает обработчик почтовых ссылок, если он настроен. Простой текст адреса без a не выполняет требование кликабельности. Для конкурса проверь и адрес, и схему ссылки.", "code": "", "example": ""}, {"id": "h019", "subject": "HTML", "topic": "Ссылки и пути", "level": 2, "prompt": "Страница лежит в pages/login.html, изображение — в media/logo.png. Каков относительный путь из страницы к изображению?", "options": ["../media/logo.png", "media/logo.png", "../../media/logo.png", "pages/media/logo.png"], "explanation": ".. поднимает на один уровень — из pages в корень проекта, затем путь ведёт в media. Относительные пути в HTML отсчитываются от URL документа, если base не задан. Проверяй регистр букв: на сервере Logo.png и logo.png могут быть разными файлами.", "code": "", "example": ""}, {"id": "h020", "subject": "HTML", "topic": "Ссылки и пути", "level": 2, "prompt": "CSS лежит в css/styles.css, шрифт — в media/fonts/site.woff2. Какой URL нужен внутри CSS?", "options": ["url(\"../media/fonts/site.woff2\")", "url(\"media/fonts/site.woff2\")", "url(\"css/media/fonts/site.woff2\")", "url(\"../../media/fonts/site.woff2\")"], "explanation": "Внешний CSS разрешает относительные url() относительно адреса самого CSS-файла. Из css сначала поднимаемся в корень, потом в media/fonts. Это отличается от разрешения адресов в HTML.", "code": "", "example": ""}, {"id": "h021", "subject": "HTML", "topic": "Ссылки и пути", "level": 1, "prompt": "Что выбрать для перехода на login.html?", "options": ["\u003ca href=\"login.html\">Войти\u003c/a>", "\u003cbutton href=\"login.html\">Войти\u003c/button>", "\u003cdiv src=\"login.html\">Войти\u003c/div>", "\u003clabel for=\"login.html\">Войти\u003c/label>"], "explanation": "Навигация выполняется ссылкой a. button нужен для действия, например отправки формы. У button нет встроенной навигации через href; при отключённом JavaScript такая подмена работать не будет.", "code": "", "example": ""}, {"id": "h022", "subject": "HTML", "topic": "Атрибуты и доступность", "level": 1, "prompt": "Как использовать id и class для пяти карточек?", "options": ["Общий class у всех, уникальный id у каждой при необходимости", "Одинаковый id у всех пяти карточек", "class разрешён только у одной карточки", "id должен всегда совпадать с class"], "explanation": "id должен быть уникален в документе. class предназначен для повторяемых групп и может содержать несколько имён через пробел. Идентификаторы из ТЗ сохраняй буквально, а общий вид карточек задавай классом.", "code": "", "example": "\u003carticle id=\"landmark-1\" class=\"landmark-card featured\">...\u003c/article>"}, {"id": "h023", "subject": "HTML", "topic": "Атрибуты и доступность", "level": 1, "prompt": "Какой alt подходит для чисто декоративного изображения рядом с уже понятным текстом?", "options": ["alt=\"\"", "Отсутствующий alt в любом случае", "alt=\"картинка\"", "alt=\"декоративная картинка картинка\""], "explanation": "Пустой alt сообщает вспомогательным технологиям, что изображение можно пропустить. Отсутствующий alt может привести к чтению имени файла. Если изображение передаёт важный смысл, нужен содержательный текстовый эквивалент.", "code": "", "example": ""}, {"id": "h024", "subject": "HTML", "topic": "Атрибуты и доступность", "level": 2, "prompt": "Логотип является единственным содержимым ссылки на главную. Какой alt наиболее полезен?", "options": ["«Открой Оренбуржье — главная»", "Пустой alt без другого доступного имени ссылки", "«logo.png»", "«Изображение»"], "explanation": "У ссылки должно быть понятное доступное имя. Если внутри только img, его alt может описывать назначение ссылки. Пустой alt без другого имени оставит такую ссылку непонятной для пользователя скринридера.", "code": "", "example": ""}, {"id": "h025", "subject": "HTML", "topic": "Атрибуты и доступность", "level": 1, "prompt": "Как правильно связать подпись с полем?", "options": ["Совпадающие for у label и id у input", "Одинаковые class у label и input", "Указать placeholder вместо label", "Указать for со значением name, не создавая id"], "explanation": "label for ссылается именно на id элемента управления. Нажатие на подпись переводит фокус в поле или переключает чекбокс. Другой корректный вариант — вложить input внутрь label.", "code": "", "example": "\u003clabel for=\"email\">E-mail\u003c/label>\n\u003cinput id=\"email\" name=\"email\" type=\"email\">"}, {"id": "h026", "subject": "HTML", "topic": "Атрибуты и доступность", "level": 2, "prompt": "Почему placeholder не заменяет видимую подпись поля?", "options": ["Подсказка исчезает при вводе и не даёт постоянного контекста", "placeholder обязательно отправляется на сервер", "placeholder доступен только для textarea", "Подписи запрещены при наличии placeholder"], "explanation": "placeholder полезен как короткий пример ввода, но пользователь должен понимать назначение поля и после ввода. Видимый label даёт постоянную подпись и доступное имя. Важные инструкции размещай отдельным текстом рядом с полем.", "code": "", "example": ""}, {"id": "h027", "subject": "HTML", "topic": "Формы", "level": 1, "prompt": "Для чего полю нужен атрибут name?", "options": ["Чтобы его значение вошло в отправляемые данные под этим именем", "Чтобы задать уникальный CSS-селектор вместо id", "Чтобы автоматически создать label", "Чтобы сделать поле обязательным"], "explanation": "При обычной отправке формы имя и значение образуют пару данных. id нужен для связи с label, якорей и селекторов; он не заменяет name. Поле без name обычно не попадёт в данные формы.", "code": "", "example": ""}, {"id": "h028", "subject": "HTML", "topic": "Формы", "level": 1, "prompt": "Что означают action и method у form?", "options": ["Адрес обработки и HTTP-метод отправки", "Название формы и её CSS-класс", "Формат картинки и кодировка текста", "Вид кнопки и цвет ошибок"], "explanation": "action задаёт адрес назначения, method — способ отправки, обычно GET или POST. Для поиска часто подходит GET: параметры попадают в URL. Для передачи пароля нужен защищённый HTTPS и подходящая серверная обработка; один POST не шифрует данные.", "code": "", "example": ""}, {"id": "h029", "subject": "HTML", "topic": "Формы", "level": 1, "prompt": "Какой type нужен полю быстрого поиска по критериям модуля А?", "options": ["search", "password", "file", "date"], "explanation": "В критериях явно указан type=\"search\". Он обозначает поисковое поле и может менять клавиатуру или оформление браузера. Сам поиск по данным атрибут не реализует.", "code": "", "example": "\u003clabel for=\"search-input\">Категория\u003c/label>\n\u003cinput id=\"search-input\" type=\"search\" list=\"categories\">"}, {"id": "h030", "subject": "HTML", "topic": "Формы", "level": 1, "prompt": "Как дать полю текстовые подсказки из списка, сохранив возможность свободного ввода?", "options": ["Связать input list с datalist id", "Вложить option прямо внутрь input", "Указать несколько значений placeholder", "Заменить input на обычный div"], "explanation": "datalist содержит предлагаемые значения, input ссылается на него через list. В отличие от select пользователь обычно может ввести и другое значение. Оформление и доступность подсказок зависят от браузера.", "code": "", "example": "\u003cinput type=\"search\" list=\"categories\">\n\u003cdatalist id=\"categories\">\n  \u003coption value=\"Музеи\">\u003c/option>\n  \u003coption value=\"Природные объекты\">\u003c/option>\n\u003c/datalist>"}, {"id": "h031", "subject": "HTML", "topic": "Формы", "level": 1, "prompt": "Какой элемент нужен для многострочного описания?", "options": ["textarea", "input type=\"textarea\"", "input type=\"multiline\"", "select"], "explanation": "textarea предназначен для многострочного текста. Начальное значение записывается между его тегами, а не в value. Размеры и возможность изменения размера регулируются CSS.", "code": "", "example": "\u003clabel for=\"description\">Описание\u003c/label>\n\u003ctextarea id=\"description\" name=\"description\" rows=\"5\">\u003c/textarea>"}, {"id": "h032", "subject": "HTML", "topic": "Формы", "level": 1, "prompt": "Какой элемент создаёт обычный выпадающий список категорий?", "options": ["select с option", "datalist без input", "textarea с li", "input type=\"select\""], "explanation": "select содержит варианты option. Атрибут value у option задаёт отправляемое значение, текст — видимую подпись. required вместе с первым пустым вариантом помогает потребовать выбор категории.", "code": "", "example": "\u003cselect name=\"category\" required>\n  \u003coption value=\"\">Выберите категорию\u003c/option>\n  \u003coption value=\"museum\">Музей\u003c/option>\n\u003c/select>"}, {"id": "h033", "subject": "HTML", "topic": "Формы", "level": 1, "prompt": "Как сгруппировать радиокнопки, чтобы выбирался только один вариант?", "options": ["Задать им одинаковый name и разные value", "Задать им одинаковый id", "Задать им разные name", "Добавить multiple каждой кнопке"], "explanation": "Радиокнопки с одинаковым name в одной группе взаимоисключают выбор. Их id должны оставаться уникальными для подписей. Для отправки значений указывают различающиеся value.", "code": "", "example": ""}, {"id": "h034", "subject": "HTML", "topic": "Формы", "level": 2, "prompt": "Что обычно отправится для отмеченного чекбокса с name=\"consent\" и value=\"yes\"?", "options": ["consent=yes; неотмеченный чекбокс обычно не отправляется", "consent=false независимо от состояния", "Только id чекбокса без значения", "Всегда consent=on, даже при value=\"yes\""], "explanation": "Отмеченный чекбокс отправляет пару name=value. Без value обычное значение по умолчанию — on. Неотмеченный чекбокс не включается в обычные данные формы, поэтому сервер должен учитывать отсутствие поля.", "code": "", "example": ""}, {"id": "h035", "subject": "HTML", "topic": "Формы", "level": 2, "prompt": "Что делает эта кнопка внутри обычной формы, если type не указан?", "options": ["Отправляет форму", "Всегда только сбрасывает поля", "Не имеет действия без JavaScript", "Создаёт новую вкладку"], "explanation": "По умолчанию button внутри обычной формы имеет тип submit. Для вспомогательной кнопки явно задавай type=\"button\". Для сброса есть type=\"reset\", но случайный сброс пользовательских данных обычно нежелателен.", "code": "\u003cform action=\"/search\">\u003cbutton>Открыть подсказку\u003c/button>\u003c/form>", "example": ""}, {"id": "h036", "subject": "HTML", "topic": "Формы", "level": 1, "prompt": "Как разрешить выбор нескольких файлов?", "options": ["\u003cinput type=\"file\" name=\"photos\" multiple>", "\u003cinput type=\"image\" name=\"photos\" multiple>", "\u003cinput type=\"files\" name=\"photos\">", "\u003ctextarea multiple name=\"photos\">\u003c/textarea>"], "explanation": "type=\"file\" открывает выбор файла, multiple разрешает несколько файлов. accept может подсказать допустимые типы. Для реальной передачи файлов обычной POST-формой задают enctype=\"multipart/form-data\".", "code": "", "example": ""}, {"id": "h037", "subject": "HTML", "topic": "Формы", "level": 2, "prompt": "Гарантирует ли accept=\"image/*\", что сервер получит только безопасное изображение?", "options": ["Нет, это подсказка выбора; сервер обязан проверять файл", "Да, браузер полностью проверяет безопасность", "Да, если input имеет id", "Нет, потому что accept разрешён только у select"], "explanation": "accept ограничивает или подсказывает выбор в интерфейсе, но не является защитой сервера. Проверяют размер, содержимое и допустимый формат. В модуле А требуется вёрстка интерфейса, а не реализация серверной проверки.", "code": "", "example": ""}, {"id": "h038", "subject": "HTML", "topic": "Формы", "level": 1, "prompt": "Какая комбинация подходит для поля пароля при регистрации?", "options": ["type=\"password\" и autocomplete=\"new-password\"", "type=\"text\" и autocomplete=\"email\"", "type=\"hidden\" и autocomplete=\"name\"", "type=\"number\" и autocomplete=\"one-time-code\""], "explanation": "password маскирует отображение символов, new-password помогает менеджеру паролей понять назначение поля. Маскирование не шифрует передачу данных. Для входа уместно autocomplete=\"current-password\".", "code": "", "example": ""}, {"id": "h039", "subject": "HTML", "topic": "Формы", "level": 2, "prompt": "Можно ли одним HTML-атрибутом проверить совпадение пароля и повторного пароля?", "options": ["Нет, у HTML нет встроенного сравнения значений двух полей", "Да, атрибутом match=\"password\"", "Да, одинаковым id у двух полей", "Да, type=\"password-confirm\""], "explanation": "required, minlength и pattern проверяют отдельное поле. Стандартного атрибута для сравнения двух полей нет. В модуле А сообщения нужно сверстать как примеры; настоящую проверку совпадения выполняют программно или на сервере.", "code": "", "example": ""}, {"id": "h040", "subject": "HTML", "topic": "Формы", "level": 2, "prompt": "Чем readonly отличается от disabled у поддерживающего их текстового поля?", "options": ["readonly обычно сохраняет фокус и отправку; disabled исключает поле из отправки", "Оба всегда исключают поле из отправки", "disabled позволяет редактирование, readonly скрывает поле", "readonly работает только у checkbox"], "explanation": "readonly запрещает изменение значения, но поле обычно остаётся фокусируемым и отправляется. disabled делает элемент недоступным для обычного взаимодействия и исключает его из отправляемых данных. readonly не применим ко всем типам элементов, например к checkbox.", "code": "", "example": ""}, {"id": "h041", "subject": "HTML", "topic": "Формы", "level": 1, "prompt": "Чем объединить связанные поля и дать всей группе заголовок?", "options": ["fieldset и legend", "section и placeholder", "label и title без полей", "table и caption в любом случае"], "explanation": "fieldset обозначает группу элементов формы, legend — её подпись. Это особенно полезно для группы радиокнопок. Вёрстку и рамку fieldset можно оформить через CSS.", "code": "", "example": ""}, {"id": "h042", "subject": "HTML", "topic": "Изображения и медиа", "level": 1, "prompt": "Зачем у img указывать width и height с корректным соотношением сторон?", "options": ["Чтобы браузер заранее резервировал место и уменьшались скачки макета", "Чтобы автоматически уменьшить размер файла на диске", "Чтобы заменить alt", "Чтобы браузер всегда растягивал картинку на весь экран"], "explanation": "Размеры дают браузеру информацию о соотношении сторон ещё до загрузки файла. Адаптивный CSS может менять отображаемый размер. Это не сжимает сам файл, поэтому оптимизация изображения всё равно нужна.", "code": "", "example": "\u003cimg src=\"media/museum.webp\" width=\"1200\" height=\"800\"\n     alt=\"Фасад музея\" loading=\"lazy\">"}, {"id": "h043", "subject": "HTML", "topic": "Изображения и медиа", "level": 2, "prompt": "Что делает loading=\"lazy\" у img?", "options": ["Позволяет браузеру отложить загрузку изображения до приближения к видимой области", "Снижает качество всех картинок до 50%", "Делает картинку чёрно-белой", "Обязательно загружает изображение последним"], "explanation": "Lazy loading полезен для изображений ниже первого экрана. Главное изображение первого экрана обычно не стоит откладывать, иначе пользователь позже увидит основной контент. Решение о моменте загрузки принимает браузер.", "code": "", "example": ""}, {"id": "h044", "subject": "HTML", "topic": "Изображения и медиа", "level": 2, "prompt": "Для чего нужен picture с source media и завершающим img?", "options": ["Для выбора разных изображений по условиям, с резервным img", "Чтобы выводить все source одновременно", "Чтобы заменить обязательный alt у img атрибутом picture", "Чтобы включить автоматический слайдер"], "explanation": "picture помогает менять композицию изображения на разных ширинах или предоставлять форматы. source задаёт условия и srcset, img служит обязательной основой и резервным вариантом. Описание alt указывают у img.", "code": "", "example": ""}, {"id": "h045", "subject": "HTML", "topic": "Изображения и медиа", "level": 2, "prompt": "Что сообщает srcset с дескрипторами 480w и 960w?", "options": ["Фактическую ширину вариантов изображения, из которых браузер выбирает подходящий", "Ширину экрана, на которой картинки обязательно скрываются", "Высоту файлов в пикселях", "Порядок слайдов"], "explanation": "Дескриптор w описывает ширину ресурса. Вместе с sizes браузер оценивает нужный вариант с учётом отображаемой ширины и плотности пикселей. Это не то же самое, что жёсткое переключение по media в picture.", "code": "", "example": ""}, {"id": "h046", "subject": "HTML", "topic": "Изображения и медиа", "level": 1, "prompt": "Как семантически объединить фотографию с подписью?", "options": ["figure и figcaption", "img и placeholder", "picture и legend", "div и caption вне таблицы"], "explanation": "figure объединяет самостоятельную иллюстрацию с относящимся к ней содержимым. figcaption содержит подпись. figure может включать не только фотографию, но и схему или фрагмент кода.", "code": "", "example": ""}, {"id": "h047", "subject": "HTML", "topic": "Таблицы и интерактивность", "level": 1, "prompt": "Как обозначить заголовок столбца таблицы?", "options": ["\u003cth scope=\"col\">Название\u003c/th>", "\u003ctd heading=\"true\">Название\u003c/td>", "\u003ch2 scope=\"table\">Название\u003c/h2>", "\u003ccaption col=\"1\">Название\u003c/caption>"], "explanation": "th обозначает заголовочную ячейку, scope=\"col\" связывает её со столбцом. Для заголовка строки подходит scope=\"row\". Таблицы используют для табличных данных, а расположение блоков страницы делают Flexbox или Grid.", "code": "", "example": ""}, {"id": "h048", "subject": "HTML", "topic": "Таблицы и интерактивность", "level": 1, "prompt": "Как сделать раскрывающийся блок без JavaScript?", "options": ["details с первым дочерним summary", "div с атрибутом openable", "p с href=\"#open\" без цели", "input type=\"details\""], "explanation": "details предоставляет встроенное раскрытие, summary — его переключатель. Клавиатурное управление доступно без JS. Для раскрывающегося меню всё равно нужно продумать подпись, фокус и расположение содержимого.", "code": "", "example": "\u003cdetails>\n  \u003csummary>Меню\u003c/summary>\n  \u003cnav>\u003ca href=\"login.html\">Войти\u003c/a>\u003c/nav>\n\u003c/details>"}, {"id": "h049", "subject": "HTML", "topic": "Таблицы и интерактивность", "level": 2, "prompt": "Почему нельзя вкладывать button внутрь ссылки a с href?", "options": ["Это вложенные интерактивные элементы с конфликтующим назначением", "Потому что button обязательно должен быть в head", "Потому что ссылка может содержать только текст", "Потому что a не поддерживает class"], "explanation": "У ссылки с href не должно быть интерактивных потомков вроде button или другой ссылки. Это создаёт проблемы валидации и взаимодействия. Для карточки можно сделать одну ссылку либо отдельные соседние элементы управления.", "code": "", "example": ""}, {"id": "h050", "subject": "HTML", "topic": "Атрибуты и доступность", "level": 2, "prompt": "Как дать ссылке с одной иконкой понятное имя, если видимого текста нет?", "options": ["Добавить подходящий aria-label или скрытый доступный текст", "Добавить только class=\"icon\"", "Уменьшить ширину до размера иконки", "Использовать пустой title"], "explanation": "Доступное имя описывает назначение элемента, например «На главную». aria-label подходит, когда видимой подписи нет; другой способ — текст, визуально скрытый корректным CSS. Для обычной текстовой ссылки дополнительный aria-label часто не нужен.", "code": "", "example": ""}, {"id": "h051", "subject": "HTML", "topic": "Атрибуты и доступность", "level": 2, "prompt": "Как разумно использовать tabindex при обычной вёрстке?", "options": ["Предпочитать естественный порядок; 0 — в последовательность, -1 — вне неё", "Назначать всем элементам значения 1, 2, 3 и далее", "Ставить tabindex=\"-1\" всем ссылкам для удобства", "Использовать tabindex вместо label"], "explanation": "Нативные ссылки и кнопки уже поддерживают клавиатуру. tabindex=\"0\" включает элемент в обычный порядок, -1 убирает из последовательности Tab, но позволяет программный фокус. Положительные значения усложняют логичный порядок перемещения.", "code": "", "example": ""}, {"id": "h052", "subject": "HTML", "topic": "Проверка и требования модуля", "level": 2, "prompt": "Что лучше всего выявляет HTML-валидатор?", "options": ["Нарушения правил разметки, вложенности и атрибутов", "Полное соответствие дизайн-макету", "Все проблемы удобства интерфейса", "Правильность серверного пароля"], "explanation": "Валидатор помогает найти технические ошибки HTML. Он не оценивает всю доступность, адаптивность или качество дизайна. После проверки разметки нужны отдельные проверки в браузере, клавиатурой и на разных ширинах.", "code": "", "example": ""}, {"id": "h053", "subject": "HTML", "topic": "Проверка и требования модуля", "level": 2, "prompt": "Для быстрого поиска заданы id search-input и search-button. Что делать с этими именами?", "options": ["Присвоить их соответствующим элементам буквально и без дубликатов", "Заменить их на русские названия по желанию", "Указать оба id у одного элемента через пробел", "Использовать их только в комментариях"], "explanation": "Идентификаторы из ТЗ используются при проверке. У элемента может быть один id, а его значение не должно содержать пробелы; значения id должны быть уникальными. Классы для стилизации можно добавлять отдельно.", "code": "", "example": ""}, {"id": "h054", "subject": "HTML", "topic": "Проверка и требования модуля", "level": 2, "prompt": "Как лучше подготовить сообщения регистрации для модуля А?", "options": ["Сверстать примеры успеха, ошибки и незаполненного поля, учитывая required", "Писать JavaScript для проверки совпадения паролей", "Оставить только placeholder с текстом ошибки", "Заменить все поля статическим изображением формы"], "explanation": "Задание требует визуальные примеры сообщений, настоящая валидация данных не требуется. При этом критерии отдельно проверяют обязательность полей: HTML required остаётся важным. Дата рождения и телефон по заданию необязательны.", "code": "", "example": ""}, {"id": "h055", "subject": "HTML", "topic": "Проверка и требования модуля", "level": 2, "prompt": "Что важнее для ссылок между конкурсными страницами?", "options": ["Рабочие href и точные имена целевых файлов", "Одинаковый синий цвет всех ссылок", "Использование onclick для каждого перехода", "Указание href=\"#\" на всех карточках"], "explanation": "С отключённым JavaScript работают обычные переходы по href. Заглушка # обычно ведёт в начало текущей страницы и не заменяет переход на landmark.html. Проверяй каждую ссылку с реального расположения страницы на сервере.", "code": "", "example": ""}, {"id": "h056", "subject": "HTML", "topic": "Проверка и требования модуля", "level": 2, "prompt": "Сколько популярных карточек требует задание на главной странице?", "options": ["Ровно 5", "Не менее 3 без верхнего ограничения", "Ровно 4", "Любое количество при наличии слайдера"], "explanation": "Для popular-section прямо указано строго пять карточек landmark-card. Не путай это с четырьмя и более слайдами и тремя и более карточками личного кабинета. Помимо количества проверяется наполнение каждой карточки.", "code": "", "example": ""}, {"id": "h057", "subject": "HTML", "topic": "Проверка и требования модуля", "level": 2, "prompt": "Что из перечисленного допустимо для реализации интерфейса модуля А?", "options": ["HTML и CSS без CSS-фреймворков и JavaScript", "HTML с Bootstrap без собственного CSS", "HTML с JavaScript только для меню", "React без сторонних компонентов"], "explanation": "Модуль А запрещает JavaScript и CSS-фреймворки, включая Bootstrap и Tailwind. Проверка проводится в Chrome с отключённым JavaScript. Для учебного теста JS используется только как механизм проверки ответов; это не сдаваемая конкурсная работа.", "code": "", "example": ""}, {"id": "h058", "subject": "HTML", "topic": "Атрибуты и доступность", "level": 2, "prompt": "Как связать пояснение к полю с самим полем для вспомогательных технологий?", "options": ["Через aria-describedby со значением id текста", "Через CSS-свойство description", "Через одинаковый placeholder у поля и абзаца", "Через атрибут href у input"], "explanation": "aria-describedby связывает элемент с одним или несколькими текстовыми описаниями по их id. Подпись label всё равно нужна. Для реально ошибочного поля можно отдельно указать aria-invalid=\"true\", но не помечай так все поля без причины.", "code": "", "example": "\u003clabel for=\"password\">Пароль\u003c/label>\n\u003cinput id=\"password\" type=\"password\" aria-describedby=\"password-help\">\n\u003cp id=\"password-help\">Не менее 8 символов\u003c/p>"}, {"id": "h059", "subject": "HTML", "topic": "Документ и синтаксис", "level": 2, "prompt": "Какой фрагмент задаёт начальное значение textarea?", "options": ["\u003ctextarea name=\"text\">Описание\u003c/textarea>", "\u003ctextarea name=\"text\" value=\"Описание\">\u003c/textarea>", "\u003cinput type=\"textarea\" value=\"Описание\">", "\u003ctextarea placeholder=\"Описание\">\u003c/textarea>"], "explanation": "Начальное значение textarea берётся из текстового содержимого между тегами. placeholder показывает подсказку, а не введённое значение. Не добавляй случайные пробелы и переносы между тегами, если они не должны стать частью исходного текста.", "code": "", "example": ""}, {"id": "h060", "subject": "HTML", "topic": "Семантика и структура", "level": 2, "prompt": "Как обозначить дату так, чтобы она имела машиночитаемое значение?", "options": ["\u003ctime datetime=\"2027-02-10\">10 февраля 2027\u003c/time>", "\u003cdate value=\"10.02.2027\">10 февраля\u003c/date>", "\u003cp type=\"date\">10 февраля 2027\u003c/p>", "\u003ctime date=\"10 февраля\">10 февраля 2027\u003c/time>"], "explanation": "time позволяет отделить видимую запись от значения datetime в установленном формате. Для даты подходит YYYY-MM-DD. Это полезно для даты публикации комментария и добавления карточки.", "code": "", "example": ""}, {"id": "c001", "subject": "CSS", "topic": "Селекторы", "level": 1, "prompt": "Как выбрать элементы с классом landmark-card?", "options": [".landmark-card", "#landmark-card", "landmark-card", "@landmark-card"], "explanation": "Точка обозначает селектор класса. Решётка выбирает id, а имя без префикса — тип элемента. Повторяющиеся карточки удобно оформлять общим классом.", "code": "", "example": ""}, {"id": "c002", "subject": "CSS", "topic": "Селекторы", "level": 1, "prompt": "Чем .menu > a отличается от .menu a?", "options": ["Первый выбирает только прямых детей, второй — ссылки на любой глубине", "Первый выбирает родителей ссылки, второй — детей", "Оба выбирают только первый a", "Первый работает только с id"], "explanation": "Пробел — комбинатор потомка, > — прямого ребёнка. Если ссылка вложена в li внутри .menu, .menu a её найдёт, а .menu > a — нет. Выбор зависит от реальной структуры HTML.", "code": "", "example": ""}, {"id": "c003", "subject": "CSS", "topic": "Селекторы", "level": 2, "prompt": "Какие элементы выбирает input:checked + label?", "options": ["label, стоящий непосредственно после отмеченного input и имеющий того же родителя", "Любой label перед отмеченным input", "Все label внутри input", "Сам input и все label страницы"], "explanation": "+ обозначает непосредственно следующего соседа. :checked проверяет состояние checkbox или radio. Для выбора последующего соседа не обязательно сразу после input подходит ~.", "code": "", "example": "\u003cinput id=\"slide-1\" type=\"radio\" name=\"slides\" checked>\n\u003clabel for=\"slide-1\">Слайд 1\u003c/label>"}, {"id": "c004", "subject": "CSS", "topic": "Селекторы", "level": 2, "prompt": "Что выбирает .card:nth-child(2)?", "options": ["Элемент .card, который является вторым элементом среди детей родителя", "Вторую карточку среди .card независимо от остальных детей", "Второго потомка каждой карточки", "Каждую чётную карточку"], "explanation": "nth-child считает положение среди элементов-соседей всех типов. Если первым ребёнком был заголовок, первая карточка может оказаться вторым ребёнком. nth-of-type считает по типу тега, а не по классу.", "code": "", "example": ""}, {"id": "c005", "subject": "CSS", "topic": "Селекторы", "level": 1, "prompt": "Чем ::before отличается от :hover?", "options": ["::before создаёт псевдоэлемент, :hover выбирает состояние элемента", "Оба всегда создают HTML-элемент в DOM", "::before работает только у ссылок", "Состояния записываются только через две двоеточия"], "explanation": "Псевдокласс описывает состояние или условие выбора, псевдоэлемент — часть представления. Для обычного ::before обычно задают content. Важный текст не стоит хранить только в генерируемом содержимом.", "code": "", "example": ""}, {"id": "c006", "subject": "CSS", "topic": "Селекторы", "level": 2, "prompt": "Как выбрать поле с type=\"email\"?", "options": ["input[type=\"email\"]", "input.email-type", "#input=email", "input::email"], "explanation": "Селектор атрибута проверяет значение HTML-атрибута. Он удобен для отдельных типов полей. Имя класса .email-type сработает только если такой class действительно указан в HTML.", "code": "", "example": ""}, {"id": "c007", "subject": "CSS", "topic": "Каскад и наследование", "level": 2, "prompt": "Обычные правила в одном слое автора: какой цвет будет у элемента?", "options": ["red", "blue", "green", "Цвет родителя независимо от этих правил"], "explanation": "При прочих равных специфичность id выше специфичности класса, а класса — выше типа элемента. Поэтому #title побеждает, хотя правило .title записано позднее. !important и слои меняют условия каскада, но здесь их нет.", "code": "/* Элемент: \u003ch1 id=\"title\" class=\"title\">Текст\u003c/h1> */\nh1 { color: green; }\n#title { color: red; }\n.title { color: blue; }", "example": ""}, {"id": "c008", "subject": "CSS", "topic": "Каскад и наследование", "level": 1, "prompt": "Что победит при одинаковой специфичности, важности, происхождении и слое?", "options": ["Правило, записанное позже", "Правило с более длинным именем класса", "Правило в файле с более коротким именем", "Правило, записанное выше"], "explanation": "Порядок объявления решает конфликт только после предыдущих этапов каскада. Это объясняет, почему базовые стили часто размещают перед переопределениями. Само количество файлов не определяет приоритет.", "code": "", "example": ""}, {"id": "c009", "subject": "CSS", "topic": "Каскад и наследование", "level": 2, "prompt": "Какое свойство обычно наследуется дочерним элементом?", "options": ["color", "margin", "border", "width"], "explanation": "Цвет текста наследуется по умолчанию. Отступы, границы и ширина обычно не наследуются. Значение inherit можно явно задать даже для обычно ненаследуемого свойства.", "code": "", "example": ""}, {"id": "c010", "subject": "CSS", "topic": "Каскад и наследование", "level": 2, "prompt": "Какова специфичность :where(.page #content) ?", "options": ["0–0–0", "1–1–0", "1–0–0", "0–1–0"], "explanation": "Псевдокласс :where() и все его аргументы дают нулевую специфичность. Это удобно для базовых правил, которые легко переопределить. У :is() другой механизм: учитывается наиболее специфичный аргумент.", "code": "", "example": ""}, {"id": "c011", "subject": "CSS", "topic": "Каскад и наследование", "level": 2, "prompt": "Почему не стоит решать каждый конфликт добавлением !important?", "options": ["Это затрудняет предсказуемые переопределения и поддержку", "Потому что !important запрещён синтаксисом CSS", "Потому что !important работает только с цветом", "Потому что он автоматически делает селектор id"], "explanation": "!important меняет приоритет декларации на этапе важности, а не повышает специфичность селектора. Частое применение затрудняет развитие стилей. Сначала проверь селекторы, порядок, слои и структуру CSS.", "code": "", "example": ""}, {"id": "c012", "subject": "CSS", "topic": "Каскад и наследование", "level": 2, "prompt": "Что означает зачёркнутая CSS-декларация в панели Styles DevTools?", "options": ["Она не применяется, например из-за победившего правила; причину нужно проверить", "Её значение обязательно унаследовано от body", "Файл CSS обязательно не загрузился", "Браузер всегда удалил HTML-элемент"], "explanation": "DevTools показывает конкурирующие декларации и итоговые computed styles. Зачёркивание может указывать на переопределение или неработающее объявление. По контексту проверь каскад, синтаксис и условия media query.", "code": "", "example": ""}, {"id": "c013", "subject": "CSS", "topic": "Блочная модель", "level": 1, "prompt": "В каком порядке идут части коробки от содержимого наружу?", "options": ["content → padding → border → margin", "content → margin → border → padding", "padding → content → margin → border", "border → content → padding → margin"], "explanation": "Padding — внутренний отступ, border — граница, margin — внешний отступ. Ширина коробки зависит также от box-sizing. Это основа расчёта размеров и поиска переполнений.", "code": "", "example": ""}, {"id": "c014", "subject": "CSS", "topic": "Блочная модель", "level": 2, "prompt": "Какова ширина border-box при этих стилях, если дополнительные ограничения отсутствуют?", "options": ["244px", "200px", "224px", "240px"], "explanation": "При content-box width задаёт ширину содержимого: 200 + 20×2 + 2×2 = 244px. Margin в ширину border-box не входит. При border-box заданные 200px уже включали бы padding и border.", "code": ".card { box-sizing: content-box; width: 200px; padding: 20px; border: 2px solid; }", "example": ""}, {"id": "c015", "subject": "CSS", "topic": "Блочная модель", "level": 2, "prompt": "Какова ширина области содержимого в этом примере?", "options": ["156px", "200px", "160px", "244px"], "explanation": "При border-box общая ширина с padding и border равна 200px. Область содержимого: 200 − 40 − 4 = 156px. Такой режим часто упрощает адаптивную вёрстку.", "code": ".card { box-sizing: border-box; width: 200px; padding: 20px; border: 2px solid; }", "example": ""}, {"id": "c016", "subject": "CSS", "topic": "Блочная модель", "level": 1, "prompt": "Как читается margin: 10px 20px 30px 40px?", "options": ["Сверху 10, справа 20, снизу 30, слева 40", "Слева 10, сверху 20, справа 30, снизу 40", "Сверху 10, снизу 20, слева 30, справа 40", "Со всех сторон 10, остальные числа игнорируются"], "explanation": "Четыре значения идут по часовой стрелке: верх, право, низ, лево. Два значения означают вертикаль и горизонталь. Три значения означают верх, горизонталь, низ.", "code": "", "example": ""}, {"id": "c017", "subject": "CSS", "topic": "Блочная модель", "level": 2, "prompt": "У двух обычных соседних блочных элементов в нормальном потоке смежные вертикальные margin 20px и 30px схлопнулись. Каково расстояние?", "options": ["30px", "50px", "10px", "0px"], "explanation": "Для двух положительных схлопывающихся вертикальных отступов результат равен большему: 30px. Во Flexbox и Grid соседние margin элементов так не схлопываются. Не всякий вертикальный отступ схлопывается: важны контекст и границы блоков.", "code": "", "example": ""}, {"id": "c018", "subject": "CSS", "topic": "Блочная модель", "level": 1, "prompt": "Что подходит для центрирования блочного контейнера с ограниченной шириной?", "options": ["max-width и margin-inline: auto", "text-align: center без ограничений для самого контейнера", "position: center", "float: center"], "explanation": "Автоматические горизонтальные margin распределяют свободное пространство по сторонам блока. max-width ограничивает ширину на больших экранах. Внутренние отступы или width с calc() защищают содержимое на узких экранах.", "code": "", "example": ".container {\n  width: calc(100% - 32px);\n  max-width: 1200px;\n  margin-inline: auto;\n}"}, {"id": "c019", "subject": "CSS", "topic": "Отображение и переполнение", "level": 1, "prompt": "Чем display: none отличается от visibility: hidden?", "options": ["Первое убирает коробку из раскладки, второе обычно сохраняет место", "Оба всегда сохраняют место", "Первое только обесцвечивает, второе удаляет DOM", "visibility: hidden только отключает мышь"], "explanation": "display: none убирает элемент из отображения и раскладки. visibility: hidden делает его невидимым, сохраняя занимаемое место. Оба способа обычно скрывают содержимое от вспомогательных технологий; для доступного скрытого текста нужен другой приём.", "code": "", "example": ""}, {"id": "c020", "subject": "CSS", "topic": "Отображение и переполнение", "level": 2, "prompt": "Почему opacity: 0 недостаточно, чтобы безопасно спрятать неактивную кнопку?", "options": ["Она может оставаться кликабельной и доступной через Tab", "Она обязательно удаляется из DOM", "Она превращается в display: none", "Она блокирует все события у родителя"], "explanation": "Opacity меняет прозрачность, но не убирает коробку и интерактивность. Даже pointer-events: none не удаляет элемент из клавиатурного порядка. Способ скрытия выбирают по тому, должно ли содержимое оставаться доступным.", "code": "", "example": ""}, {"id": "c021", "subject": "CSS", "topic": "Отображение и переполнение", "level": 1, "prompt": "Как сделать широкую таблицу прокручиваемой по горизонтали на мобильном?", "options": ["Поместить в контейнер с overflow-x: auto", "Назначить body width: 1920px", "Уменьшить весь текст до 5px", "Скрыть таблицу через opacity: 0"], "explanation": "Прокрутку лучше ограничить конкретным широким блоком. Страница целиком должна оставаться адаптивной. overflow-x: hidden на body может скрыть симптом ошибки и сделать важный контент недоступным.", "code": "", "example": ""}, {"id": "c022", "subject": "CSS", "topic": "Отображение и переполнение", "level": 2, "prompt": "Как позволить длинному URL переноситься внутри узкой карточки?", "options": ["overflow-wrap: anywhere", "white-space: nowrap", "overflow-x: visible", "text-transform: lowercase"], "explanation": "overflow-wrap: anywhere разрешает разрывы длинных непрерывных последовательностей. Это помогает избежать горизонтального переполнения. Если карточка является flex/grid-элементом, дополнительно может понадобиться min-width: 0.", "code": "", "example": ""}, {"id": "c023", "subject": "CSS", "topic": "Flexbox", "level": 1, "prompt": "Что нужно назначить родителю, чтобы его прямые дети стали flex-элементами?", "options": ["display: flex", "position: flex", "flex: 1", "align-items: flex"], "explanation": "display: flex создаёт flex-контейнер. flex: 1 задают самому flex-элементу, а не используют для включения раскладки. Вложенные потомки не становятся flex-элементами этого контейнера автоматически.", "code": "", "example": ""}, {"id": "c024", "subject": "CSS", "topic": "Flexbox", "level": 1, "prompt": "Как в Flexbox определяются главная и поперечная оси?", "options": ["По flex-direction; justify-content работает вдоль главной", "Главная всегда горизонтальна независимо от flex-direction", "Поперечная всегда совпадает с направлением текста", "align-items меняет главную ось"], "explanation": "При row главная ось обычно горизонтальная, при column — вертикальная, с учётом режима письма. justify-content выравнивает вдоль главной оси, align-items — по поперечной. Поэтому «центрирование по горизонтали» не всегда означает justify-content.", "code": "", "example": ""}, {"id": "c025", "subject": "CSS", "topic": "Flexbox", "level": 1, "prompt": "Как разрешить перенос flex-элементов на новые строки?", "options": ["flex-wrap: wrap", "white-space: wrap", "display: wrap", "overflow: flex"], "explanation": "По умолчанию flex-wrap имеет значение nowrap. wrap разрешает дополнительные строки, если элементы не помещаются. Для расстояния между ними удобно использовать gap.", "code": "", "example": ""}, {"id": "c026", "subject": "CSS", "topic": "Flexbox", "level": 2, "prompt": "Зачем flex-элементу с длинным содержимым иногда нужно min-width: 0?", "options": ["Чтобы разрешить сжатие ниже автоматического минимального размера по содержимому", "Чтобы полностью скрыть элемент", "Чтобы запретить перенос текста", "Чтобы сделать ширину строго нулевой"], "explanation": "Автоматический минимум flex-элемента может удерживать его ширину по содержимому. min-width: 0 позволяет ему сжаться, а тексту — перенестись или обрезаться по заданным правилам. Это не равно width: 0.", "code": "", "example": ""}, {"id": "c027", "subject": "CSS", "topic": "Flexbox", "level": 2, "prompt": "Что примерно означает flex: 1 в обычной браузерной практике?", "options": ["Рост 1, сжатие 1, начальная база 0%", "Рост 0, сжатие 0, база auto", "Ширина строго 1px", "Выравнивание по первой строке"], "explanation": "Браузеры обычно раскрывают flex: 1 в 1 1 0%. Элемент получает долю свободного пространства, но минимальные размеры и содержимое всё ещё влияют на итог. Для полностью явного поведения запиши flex-grow, flex-shrink и flex-basis.", "code": "", "example": ""}, {"id": "c028", "subject": "CSS", "topic": "Flexbox", "level": 2, "prompt": "Что произойдёт от margin-left: auto у последнего элемента в обычном flex-row при наличии свободного места?", "options": ["Он заберёт свободное место слева и сдвинется вправо", "Он обязательно получит ширину 100%", "Он выйдет из потока как absolute", "Все элементы автоматически станут одной ширины"], "explanation": "Автоматический margin поглощает свободное пространство в соответствующем направлении. Это удобно для кнопки входа справа от меню. Свойство не создаст свободное место, если его уже нет.", "code": "", "example": ""}, {"id": "c029", "subject": "CSS", "topic": "Flexbox", "level": 2, "prompt": "Почему нельзя полагаться только на order для изменения смыслового порядка содержимого?", "options": ["Визуальный порядок может разойтись с чтением и переходом клавиатурой", "Потому что order меняет HTML-файл на диске", "Потому что order работает только у изображений", "Потому что order запрещает media queries"], "explanation": "order меняет визуальную раскладку flex/grid-элементов, но не исходный порядок DOM. Пользователь клавиатуры или скринридера может получить другой порядок. Сначала делай логичную HTML-структуру, затем адаптируй её вид.", "code": "", "example": ""}, {"id": "c030", "subject": "CSS", "topic": "Grid", "level": 1, "prompt": "Как создать три равные гибкие колонки?", "options": ["grid-template-columns: repeat(3, 1fr)", "grid-columns: 3 equal", "grid-template-rows: 3fr", "display: grid(3)"], "explanation": "После display: grid свойство grid-template-columns задаёт колонки. fr распределяет свободное пространство, но автоматический минимум треков иногда ограничивает сжатие. Для защиты от длинного контента часто используют minmax(0, 1fr).", "code": "", "example": ""}, {"id": "c031", "subject": "CSS", "topic": "Grid", "level": 2, "prompt": "Что делает эта сетка?", "options": ["Создаёт столько колонок минимум по 240px, сколько помещается, расширяя их на свободное место", "Всегда создаёт ровно 240 колонок", "Делает все карточки высотой 240px", "Задаёт максимум 1px для каждой колонки"], "explanation": "auto-fit подбирает количество треков по доступной ширине и схлопывает пустые. minmax задаёт минимум 240px и гибкий максимум. Если контейнер уже 240px, такой минимум может вызвать переполнение: минимум нужно согласовать с мобильным размером.", "code": ".cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; }", "example": ""}, {"id": "c032", "subject": "CSS", "topic": "Grid", "level": 2, "prompt": "Как позволить элементу занять всю ширину явной grid-сетки независимо от числа колонок?", "options": ["grid-column: 1 / -1", "grid-row: 100%", "column-span: all-flex", "width: -1"], "explanation": "Линия 1 — первая, -1 — последняя линия явной сетки. Элемент растягивается между ними по колонкам. Это удобно для заголовка над карточками или широкого блока формы.", "code": "", "example": ""}, {"id": "c033", "subject": "CSS", "topic": "Grid", "level": 2, "prompt": "Зачем в равных колонках используют minmax(0, 1fr)?", "options": ["Чтобы длинное содержимое не заставляло минимальный размер трека превышать доступное место", "Чтобы сделать все колонки нулевой ширины", "Чтобы отключить gap", "Чтобы заменить display: grid"], "explanation": "Минимум 0 снимает автоматическое ограничение по минимальному содержимому у трека. Колонки получают равные доли пространства и могут сжиматься. Содержимое всё равно нужно корректно переносить или ограничивать.", "code": "", "example": ""}, {"id": "c034", "subject": "CSS", "topic": "Позиционирование", "level": 1, "prompt": "Какой элемент обычно становится содержащим блоком для absolute-потомка?", "options": ["Ближайший предок с position не static при отсутствии других создающих блок условий", "Всегда body независимо от стилей", "Любой ближайший a независимо от стилей", "Предыдущий сосед в HTML"], "explanation": "Распространённая схема — position: relative у карточки и absolute у бейджа. Абсолютный элемент исключается из обычного потока. Содержащий блок могут создавать и другие свойства, например transform, поэтому слово «всегда» здесь было бы ошибкой.", "code": "", "example": ".card { position: relative; }\n.badge { position: absolute; top: 12px; right: 12px; }"}, {"id": "c035", "subject": "CSS", "topic": "Позиционирование", "level": 1, "prompt": "Чем position: relative со сдвигом top отличается от absolute?", "options": ["Relative сохраняет исходное место в потоке, absolute обычно нет", "Relative всегда привязан к окну", "Absolute никогда не может быть внутри relative", "Оба всегда перестраивают соседей по новой позиции"], "explanation": "Relative визуально сдвигает коробку относительно её исходного положения, сохраняя место. Absolute вынимается из нормального потока. Поэтому absolute не подходит как универсальный инструмент раскладки всей страницы.", "code": "", "example": ""}, {"id": "c036", "subject": "CSS", "topic": "Позиционирование", "level": 2, "prompt": "Какое условие обычно необходимо для прилипания шапки со sticky?", "options": ["Задать порог, например top: 0, и проверить прокручиваемых предков", "Задать только z-index: 999999", "Назначить display: none до прокрутки", "Перевести все соседние блоки в absolute"], "explanation": "Sticky работает в границах своего контейнера и относительно соответствующего scrollport. Переполнение у предков может менять ожидаемое поведение. Без порога вроде top: 0 на нужной оси прилипания не будет.", "code": "", "example": ""}, {"id": "c037", "subject": "CSS", "topic": "Позиционирование", "level": 2, "prompt": "Почему z-index: 9999 не гарантирует, что элемент перекроет всё на странице?", "options": ["Он ограничен своим контекстом наложения", "Значения выше 100 запрещены CSS", "z-index работает только у img", "z-index всегда сравнивает только высоту элементов"], "explanation": "Контексты наложения сравниваются как группы. Дочерний элемент не может просто перепрыгнуть чужой контекст увеличением собственного z-index. Новые контексты могут создавать transform, opacity меньше 1 и другие условия.", "code": "", "example": ""}, {"id": "c038", "subject": "CSS", "topic": "Размеры и единицы", "level": 1, "prompt": "От чего зависит 1rem?", "options": ["От размера шрифта корневого элемента html", "От ширины viewport", "От высоты текущей карточки", "От размера шрифта ближайшего p"], "explanation": "rem привязан к корневому font-size. em для font-size зависит от размера шрифта родителя, а для многих других свойств — от размера шрифта самого элемента. Это различие важно при вложенных компонентах.", "code": "", "example": ""}, {"id": "c039", "subject": "CSS", "topic": "Размеры и единицы", "level": 2, "prompt": "У элемента font-size: 20px и padding: 1em. Каков padding?", "options": ["20px", "16px независимо от font-size", "1px", "20% ширины родителя"], "explanation": "В padding единица em вычисляется относительно размера шрифта самого элемента. Значит, 1em = 20px. Для font-size сама em вычисляется относительно размера шрифта родителя.", "code": "", "example": ""}, {"id": "c040", "subject": "CSS", "topic": "Размеры и единицы", "level": 2, "prompt": "Что делает font-size: clamp(1rem, 2vw, 2rem)?", "options": ["Плавно меняет размер в пределах от 1rem до 2rem", "Всегда задаёт ровно 2vw без ограничений", "Переключает размер только при 360px", "Складывает все три размера"], "explanation": "clamp(минимум, предпочтительное, максимум) ограничивает гибкое значение. При небольшом 2vw сработает нижняя граница, при большом — верхняя. Для текста сохраняй возможность масштабирования и проверяй читаемость.", "code": "", "example": ""}, {"id": "c041", "subject": "CSS", "topic": "Размеры и единицы", "level": 1, "prompt": "Как правильно вычислить ширину 100% минус 32px?", "options": ["width: calc(100% - 32px)", "width: 100%-32px", "width: calc(100% -32px)", "width: minus(100%, 32px)"], "explanation": "calc позволяет смешивать совместимые единицы. Вокруг бинарных + и - необходимы пробелы. Само вычисление ширины не отменяет padding и border при content-box.", "code": "", "example": ""}, {"id": "c042", "subject": "CSS", "topic": "Размеры и единицы", "level": 2, "prompt": "Почему min-height часто удобнее height для текстовой карточки?", "options": ["Она задаёт минимум, позволяя блоку расти при увеличении текста", "Она всегда делает карточку ниже текста", "Она полностью запрещает переполнение", "Она удаляет внутренние отступы"], "explanation": "Фиксированная height может привести к обрезке или выходу текста при переносах и масштабировании. min-height позволяет содержимому увеличить высоту. Проверяй карточки с длинными заголовками и на мобильном.", "code": "", "example": ""}, {"id": "c043", "subject": "CSS", "topic": "Адаптивность", "level": 1, "prompt": "Что означает mobile-first в организации CSS?", "options": ["Базовые стили для узкого экрана, расширения через min-width", "Сначала фиксированная ширина 1920px для всех устройств", "Отдельная HTML-страница для каждой ширины", "Скрытие всего содержимого на компьютере"], "explanation": "Mobile-first начинает с простой узкой раскладки и добавляет возможности по мере роста пространства. Это соответствует мобильной направленности задания. Брейкпоинты выбирают по поведению контента, а не только по названиям устройств.", "code": "", "example": ""}, {"id": "c044", "subject": "CSS", "topic": "Адаптивность", "level": 1, "prompt": "Когда срабатывает @media (min-width: 768px)?", "options": ["При ширине viewport 768 CSS-пикселей и больше", "Только при ширине строго меньше 768px", "При высоте элемента 768px", "Только при физической ширине монитора 768 пикселей"], "explanation": "Условие включает саму границу 768px. CSS-пиксель не обязан совпадать с физическим пикселем экрана. Media query оценивает область просмотра, а не ширину конкретной карточки.", "code": "", "example": ""}, {"id": "c045", "subject": "CSS", "topic": "Адаптивность", "level": 2, "prompt": "Какой вариант является структурным изменением макета?", "options": ["Переход карточек из одной колонки в три", "Замена только цвета кнопки", "Увеличение только насыщенности текста", "Изменение только цвета тени"], "explanation": "Структурные изменения затрагивают организацию блоков: колонки, размещение, ориентацию секций. Одни косметические изменения обычно не доказывают адаптивную перестройку. По критериям модуля бургер не засчитывается в четыре структурных изменения.", "code": "", "example": ""}, {"id": "c046", "subject": "CSS", "topic": "Адаптивность", "level": 2, "prompt": "Что разумно проверить при горизонтальной прокрутке всей страницы на 360px?", "options": ["Фиксированные ширины, min-width, длинный текст и размеры медиа", "Только значение color у body", "Только наличие doctype, игнорируя CSS", "Только название HTML-файла"], "explanation": "Частые причины — жёсткая ширина, большие минимумы сетки, неужимаемые flex-элементы и изображения. Найди выступающий элемент в DevTools и исправь источник. Простое скрытие переполнения может отрезать содержимое.", "code": "", "example": ""}, {"id": "c047", "subject": "CSS", "topic": "Адаптивность", "level": 1, "prompt": "Как сделать обычное контентное изображение гибким, сохранив пропорции?", "options": ["max-width: 100%; height: auto; display: block", "width: 1920px; height: 100px", "height: 100%; width: auto во всех случаях", "overflow: hidden на img без размеров"], "explanation": "max-width ограничивает изображение шириной контейнера, height: auto сохраняет соотношение сторон. display: block убирает зазор, связанный со строчным базовым выравниванием. Для одинаковых рамок карточек дополнительно нужны другие приёмы.", "code": "", "example": ""}, {"id": "c048", "subject": "CSS", "topic": "Адаптивность", "level": 2, "prompt": "Что проверять помимо крайних ширин 360 и 1920px?", "options": ["Промежуточные ширины, длинный контент и увеличение масштаба", "Только точную ширину своего монитора", "Только мобильный скриншот без взаимодействия", "Только размер файла CSS"], "explanation": "Макет может сломаться между контрольными точками. Проверяй плавное изменение ширины, переносы, доступность кнопок и отсутствие потери контента. Проверка крайних размеров нужна по заданию, но не гарантирует устойчивость всего диапазона.", "code": "", "example": ""}, {"id": "c049", "subject": "CSS", "topic": "Изображения и оформление", "level": 1, "prompt": "Как заполнить рамку изображения без искажения пропорций, допускающе обрезку?", "options": ["object-fit: cover", "object-fit: fill", "background-repeat: repeat", "object-fit: contain всегда без пустого места"], "explanation": "cover сохраняет пропорции и заполняет коробку, обрезая лишнее. contain помещает изображение целиком, но может оставить свободные полосы. Для эффекта нужны определённые размеры коробки, например ширина и aspect-ratio.", "code": "", "example": ".card img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }"}, {"id": "c050", "subject": "CSS", "topic": "Изображения и оформление", "level": 2, "prompt": "Для чего нужен object-position при object-fit: cover?", "options": ["Чтобы выбрать положение изображения внутри рамки и область обрезки", "Чтобы перенести img в конец DOM", "Чтобы задать тип сжатия файла", "Чтобы заменить position: absolute у контейнера"], "explanation": "object-position управляет выравниванием содержимого замещаемого элемента. Например, center top сохраняет верхнюю часть кадра. Это помогает не обрезать важный объект на карточке.", "code": "", "example": ""}, {"id": "c051", "subject": "CSS", "topic": "Изображения и оформление", "level": 1, "prompt": "Как задать пропорции рамки 16 к 9 без фиксированной высоты?", "options": ["aspect-ratio: 16 / 9", "ratio: 16:9", "height: 16/9", "object-fit: 16 / 9"], "explanation": "aspect-ratio задаёт предпочтительное соотношение ширины и высоты. Оно особенно полезно, когда хотя бы один размер остаётся автоматическим. Само свойство не определяет способ обрезки изображения — это задача object-fit.", "code": "", "example": ""}, {"id": "c052", "subject": "CSS", "topic": "Шрифты и текст", "level": 1, "prompt": "Как подключить предоставленный локальный шрифт?", "options": ["Через @font-face с font-family и src, затем использовать font-family", "Через @font-import без src", "Через img с путём к woff2", "Через font-family с именем файла без загрузки"], "explanation": "@font-face описывает ресурс шрифта. Путь считается от CSS-файла; начертание задаётся font-weight и font-style. Используй только действительно предоставленные файлы и добавляй резервное семейство.", "code": "", "example": "@font-face {\n  font-family: \"Site\";\n  src: url(\"../media/fonts/site.woff2\") format(\"woff2\");\n  font-weight: 400;\n  font-display: swap;\n}\nbody { font-family: \"Site\", Arial, sans-serif; }"}, {"id": "c053", "subject": "CSS", "topic": "Шрифты и текст", "level": 2, "prompt": "Что даёт font-display: swap?", "options": ["Позволяет сначала показать резервный шрифт, затем заменить загруженным", "Заменяет все изображения шрифтами", "Гарантирует отсутствие любых сдвигов при загрузке", "Всегда запрещает загрузку веб-шрифта"], "explanation": "swap уменьшает время невидимого текста, используя резервное начертание до загрузки нужного. При замене возможен сдвиг макета из-за различий метрик. Подбирай подходящий fallback и проверяй результат.", "code": "", "example": ""}, {"id": "c054", "subject": "CSS", "topic": "Шрифты и текст", "level": 1, "prompt": "Почему line-height: 1.5 удобен для основного текста?", "options": ["Безразмерный множитель масштабируется вместе с размером шрифта", "Он задаёт высоту всех карточек 1.5px", "Он запрещает перенос строк", "Он меняет число колонок"], "explanation": "Безразмерный line-height наследуется как коэффициент. Дочерний текст с другим размером получает пропорциональный межстрочный интервал. Подходящее значение зависит от шрифта и плотности текста.", "code": "", "example": ""}, {"id": "c055", "subject": "CSS", "topic": "Шрифты и текст", "level": 2, "prompt": "Какая комбинация нужна для обычного однострочного многоточия?", "options": ["overflow: hidden; white-space: nowrap; text-overflow: ellipsis при ограниченной ширине", "Только text-overflow: ellipsis без ограничения ширины", "Только letter-spacing: ellipsis", "display: none и overflow: visible"], "explanation": "Многоточие появляется, когда текст действительно переполняет ограниченную коробку. nowrap запрещает перенос, hidden обрезает, ellipsis показывает многоточие. Не скрывай без необходимости важные данные; в flex-контексте может потребоваться min-width: 0.", "code": "", "example": ""}, {"id": "c056", "subject": "CSS", "topic": "Темы и переменные", "level": 1, "prompt": "Как объявить и использовать CSS-переменную?", "options": ["--accent: #245c45; затем color: var(--accent)", "accent = #245c45; затем color: accent", "@accent: #245c45; затем color: @accent в обычном CSS", "$accent: #245c45; затем color: $accent в обычном CSS"], "explanation": "Нативные custom properties начинаются с двух дефисов. Значение используют через var(). Они участвуют в каскаде и обычно наследуются, что удобно для общих цветов и тем.", "code": "", "example": ":root { --accent: #245c45; }\n.button { background: var(--accent); }"}, {"id": "c057", "subject": "CSS", "topic": "Темы и переменные", "level": 2, "prompt": "Как сделать тёмную тему на отдельной HTML-странице без дублирования всех стилей?", "options": ["Общий CSS и класс темы, переопределяющий переменные", "Скопировать все стили и менять каждый селектор вручную", "Добавить onclick на body", "Заменить весь сайт одним тёмным изображением"], "explanation": "Переменные позволяют менять фон, текст, границы и акценты в одном месте. На index_dark.html можно задать class=\"theme-dark\" на body. По заданию контент главной сохраняется, а визуальных отличий должно быть не менее четырёх.", "code": "", "example": ":root { --bg: #fff; --text: #18251f; --line: #ccd8d0; --accent: #245c45; }\n.theme-dark { --bg: #14211b; --text: #eef6f0; --line: #53665a; --accent: #9bd5af; }\nbody { background: var(--bg); color: var(--text); }"}, {"id": "c058", "subject": "CSS", "topic": "Темы и переменные", "level": 2, "prompt": "Что делает color: var(--text, #222)?", "options": ["Использует резервное #222, если --text отсутствует или имеет guaranteed-invalid значение", "Всегда смешивает --text и #222", "Автоматически исправляет любое значение --text, включая 20px", "Сбрасывает все переменные элемента"], "explanation": "Fallback помогает, когда переменная не определена или недоступна для подстановки. Но если --text задана как 20px, подстановка существует, а результат не подходит свойству color; fallback #222 не является универсальной проверкой типа. Для начала задавай цветовые переменные корректными цветами.", "code": "", "example": ""}, {"id": "c059", "subject": "CSS", "topic": "CSS без JavaScript", "level": 2, "prompt": "Какой подход может управлять состоянием мобильного меню без JS?", "options": ["Фокусируемый checkbox с label и селектором :checked либо details/summary", "div с onclick=\"openMenu()\"", "Атрибут href=\"javascript:...\"", "CSS-свойство menu-open: tru
