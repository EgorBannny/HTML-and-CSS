e"], "explanation": "Checkbox или details предоставляют состояние, доступное без скриптов. При checkbox-подходе не прячь input через display: none, если нужен переход к нему клавишей Tab. Добавь видимый индикатор фокуса у его подписи и проверь клавиатуру.", "code": "", "example": ""}, {"id": "c060", "subject": "CSS", "topic": "CSS без JavaScript", "level": 2, "prompt": "Почему input { display: none } — проблема для клавиатурного CSS-переключателя меню?", "options": ["Input исключается из порядка фокуса, Tab не сможет его выбрать", "Он всегда становится отмеченным", "Он превращается в текстовое поле", "Это отключает все селекторы :checked в браузере"], "explanation": "Скрытый через display: none checkbox можно переключать мышью по label, но сам он недоступен через Tab. Используй технику визуального скрытия с сохранением фокуса или нативный details. Видимый фокус должен отражаться на понятном элементе интерфейса.", "code": "", "example": ""}, {"id": "c061", "subject": "CSS", "topic": "CSS без JavaScript", "level": 2, "prompt": "Какой механизм подходит для взаимоисключающего выбора слайда без JS?", "options": ["Radio с общим name и правила :checked для панели слайдов", "Checkbox с разными name без дополнительных правил", "Несколько div с одинаковыми id", "Только cursor: pointer на картинках"], "explanation": "Radio хранит выбор одного слайда в группе. CSS показывает соответствующий слайд или сдвигает ленту, label обеспечивает переключение. Нужны активные индикаторы, плавный переход и проверка клавиатурного управления.", "code": "", "example": ""}, {"id": "c062", "subject": "CSS", "topic": "CSS без JavaScript", "level": 2, "prompt": "Как выбрать состояние элемента, на который указывает фрагмент URL?", "options": [":target", ":visited-target", "::anchor", ":url"], "explanation": "Если URL заканчивается на #slide-2, элемент с id=\"slide-2\" соответствует :target. Это ещё один механизм CSS-интерактивности. Он меняет фрагмент URL и может влиять на прокрутку и историю переходов.", "code": "", "example": ""}, {"id": "c063", "subject": "CSS", "topic": "Анимации", "level": 1, "prompt": "Чем transition отличается от @keyframes animation?", "options": ["Transition описывает переход при изменении значения, animation позволяет задать последовательность ключевых кадров", "Transition работает только с JS, animation — только с CSS", "Оба применяются только к цвету текста", "Animation всегда требует hover"], "explanation": "Transition удобен для изменения при hover, focus или :checked. Keyframes позволяют описывать несколько состояний и циклы. Для интерактивных элементов избегай резких и чрезмерных движений.", "code": "", "example": ""}, {"id": "c064", "subject": "CSS", "topic": "Анимации", "level": 2, "prompt": "Какие свойства обычно удобнее анимировать для движения карточки?", "options": ["transform и opacity", "width, height и top одновременно без необходимости", "display между block и none обычным transition без дополнительных условий", "font-family между двумя разными шрифтами"], "explanation": "Transform и opacity часто позволяют избежать пересчёта геометрии и перерисовки всего макета, хотя результат зависит от браузера. Анимация width/height может быть дороже из-за layout. Используй движение только там, где оно помогает пользователю.", "code": "", "example": ""}, {"id": "c065", "subject": "CSS", "topic": "Анимации", "level": 2, "prompt": "Как уважать системную настройку уменьшения движения?", "options": ["Использовать @media (prefers-reduced-motion: reduce)", "Добавить animation: faster всем элементам", "Установить opacity: 0 на весь сайт", "Отключить CSS целиком"], "explanation": "Media query позволяет уменьшить или отключить несущественные анимации. Не уничтожай необходимое состояние интерфейса при отключении движения. Это особенно полезно для слайдеров и плавной прокрутки.", "code": "", "example": "@media (prefers-reduced-motion: reduce) {\n  .slider-track { transition: none; }\n  html { scroll-behavior: auto; }\n}"}, {"id": "c066", "subject": "CSS", "topic": "Анимации", "level": 2, "prompt": "Почему обычный transition: height .3s от 0 до auto часто не даёт ожидаемой плавности?", "options": ["auto не является обычным числовым концом интерполяции; нужен подходящий приём или явно поддерживаемая возможность", "Потому что height вообще никогда не анимируется", "Потому что auto означает 0px", "Потому что transition работает только с color"], "explanation": "Классический переход требует интерполируемых значений, а auto вычисляется из содержимого. Можно выбрать другой способ раскрытия или пользоваться новыми возможностями только после проверки поддержки. Для конкурсного решения полезнее надёжный механизм, проверенный в целевом браузере.", "code": "", "example": ""}, {"id": "c067", "subject": "CSS", "topic": "Печать", "level": 1, "prompt": "Где описывают стили для печати?", "options": ["В @media print", "В @media hover", "В @print-only без media", "В script type=\"print\""], "explanation": "@media print применяется при печати и её предварительном просмотре. Внутри можно скрыть навигацию, изменить цвета и показать отдельный заголовок. Проверяй через Ctrl+P, а не только по обычному виду страницы.", "code": "", "example": ""}, {"id": "c068", "subject": "CSS", "topic": "Печать", "level": 2, "prompt": "Как сделать фотографию чёрно-белой при печати?", "options": ["В @media print задать filter: grayscale(1) нужному img", "Назначить img color: gray", "Задать opacity: 0", "Убрать alt изображения"], "explanation": "Цвет текста не перекрашивает пиксели изображения. filter: grayscale(1) переводит изображение в градации серого. Для модуля А отдельно проверь, что при печати остаются нужные название и изображение, появляется «Добро пожаловать!», а лишние блоки скрыты.", "code": "", "example": ""}, {"id": "c069", "subject": "CSS", "topic": "Печать", "level": 2, "prompt": "Как показать заголовок только при печати?", "options": ["Скрыть его в обычном режиме и переопределить display в @media print", "Поставить ему opacity: 0 навсегда", "Записать текст только в HTML-комментарий", "Назначить class=\"print\" без CSS"], "explanation": "Класс сам по себе ничего не меняет. Нужны обычные стили скрытия и print-переопределение. Заголовок должен оставаться частью разметки, а правило print должно победить базовое по каскаду.", "code": "", "example": ".print-title { display: none; }\n@media print {\n  .print-title { display: block; }\n  header, footer, nav, form { display: none; }\n  .landmark-image { filter: grayscale(1); }\n}"}, {"id": "c070", "subject": "CSS", "topic": "Доступность и качество", "level": 1, "prompt": "Что следует добавить к hover-оформлению кнопок для пользователей клавиатуры?", "options": ["Заметное состояние :focus-visible", "outline: none без замены", "pointer-events: none", "tabindex=\"-1\" на все кнопки"], "explanation": "Фокус показывает, где находится клавиатурное управление. Удалять outline без равноценной замены нельзя. :focus-visible помогает выделять фокус тогда, когда браузер считает его необходимым.", "code": "", "example": ".button:focus-visible {\n  outline: 3px solid #c36a20;\n  outline-offset: 3px;\n}"}, {"id": "c071", "subject": "CSS", "topic": "Доступность и качество", "level": 2, "prompt": "Почему одного красного цвета недостаточно для сообщения об ошибке поля?", "options": ["Нужны текст или другой различимый признак, потому что цвет воспринимают по-разному", "Потому что CSS не умеет красный цвет", "Потому что ошибки разрешены только в title", "Потому что любое сообщение нужно скрывать"], "explanation": "Ошибка должна быть понятна без различения цвета. Добавь ясный текст рядом с полем, при необходимости значок и связь с описанием. Успех, ошибка и незаполненное поле должны отличаться не только оттенком рамки.", "code": "", "example": ""}, {"id": "c072", "subject": "CSS", "topic": "Доступность и качество", "level": 2, "prompt": "Как проверить контраст текста на однотонном фоне?", "options": ["Измерить отношение контраста инструментом DevTools или проверкой WCAG", "Оценить только яркость монитора", "Посмотреть, использован ли тег strong", "Увеличить z-index текста"], "explanation": "Контраст измеряют между цветом текста и фоном. Для обычного текста распространённый порог WCAG AA — 4.5:1, для крупного — 3:1 с установленными условиями размера и жирности. Это учебный ориентир; точное оценивание конкурса сверяй с его критериями.", "code": "", "example": ""}, {"id": "c073", "subject": "CSS", "topic": "Доступность и качество", "level": 2, "prompt": "Почему меню, раскрывающееся только на :hover, недостаточно надёжно?", "options": ["На сенсорных устройствах и с клавиатуры наведение может быть недоступно", "Потому что hover всегда запрещён в Chrome", "Потому что hover автоматически делает меню фиксированным", "Потому что hover работает только в печати"], "explanation": "Доступ к меню не должен зависеть только от указателя мыши. Продумай переключение через нативный элемент, клик и клавиатуру. :focus-within может помогать, но не заменяет проверки полного сценария открытия и закрытия.", "code": "", "example": ""}, {"id": "c074", "subject": "CSS", "topic": "Организация и проверка", "level": 1, "prompt": "Как правильно писать комментарий в CSS?", "options": ["/* Раздел карточек */", "\u003c!-- Раздел карточек -->", "// Раздел карточек в обычном CSS", "\u003ccomment>Раздел карточек\u003c/comment>"], "explanation": "Обычный CSS использует комментарии /* ... */. Они полезны для разделов файла и объяснения нестандартных решений. В критериях ценятся структура, осмысленные имена, группировка свойств и несколько CSS-файлов.", "code": "", "example": ""}, {"id": "c075", "subject": "CSS", "topic": "Организация и проверка", "level": 2, "prompt": "Какое имя класса лучше подходит для элемента заголовка карточки в распространённой записи БЭМ?", "options": ["landmark-card__title", "landmark-card#title", "zagolovok-kartochki", "a123"], "explanation": "В БЭМ блок обозначают именем компонента, элемент — через __, модификатор часто через --. Методология помогает организовать повторяемые части. Сам синтаксис имён не является особой возможностью браузера и не заменяет правильную структуру CSS.", "code": "", "example": ""}, {"id": "c076", "subject": "CSS", "topic": "Организация и проверка", "level": 2, "prompt": "Что проверять, если правило из media query не применяется?", "options": ["Условие ширины, совпадение селектора, загрузку файла и каскад", "Только размер изображения логотипа", "Только наличие class у body независимо от селектора", "Только число коммитов"], "explanation": "DevTools позволяет проверить активность media query, совпадение правила и computed styles. Также проверь синтаксис и путь к CSS. Начинай с наблюдаемой причины, а не добавляй !important случайно.", "code": "", "example": ""}, {"id": "c077", "subject": "CSS", "topic": "Организация и проверка", "level": 2, "prompt": "Какая организация стилей ближе к максимальным требованиям технического качества в критериях?", "options": ["Несколько CSS-файлов, структурные комментарии, осмысленные имена и группировка свойств", "Все стили только в style-атрибутах", "Один огромный файл с именами a1, a2, a3", "Разные несвязанные стили одинаковой шапки на каждой странице"], "explanation": "Критерии отдельно перечисляют минимум два CSS-файла как один из приёмов, вводные и структурные комментарии, осмысленные имена без транслитерации и группировку свойств. Общие компоненты должны выглядеть согласованно на разных страницах. Не путай конкурсную структуру проекта с этим учебным однофайловым тестом.", "code": "", "example": ""}, {"id": "c078", "subject": "CSS", "topic": "Организация и проверка", "level": 2, "prompt": "Какой план адаптации лучше учитывает критерий четырёх изменений без учёта бургера?", "options": ["Сетка 1→3 колонки, герой столбец→строка, форма 1→2 колонки, подвал столбец→сетка", "Бургер и три смены цвета", "Только уменьшение шрифта в четырёх местах", "Скрыть четыре обязательных раздела на мобильном"], "explanation": "Нужны самостоятельные изменения структуры, которые можно показать при проверке. Пример плана не является автоматической гарантией баллов: каждая нужная страница должна оставаться функциональной и соответствовать ТЗ. Обязательный контент нельзя терять ради компактности.", "code": "", "example": ""}, {"id": "c079", "subject": "CSS", "topic": "Селекторы", "level": 2, "prompt": "Как подсветить всю группу поля при фокусе на вложенном input?", "options": [".field:focus-within", ".field::focus-child", ".field:checked", ".field > :hover-only"], "explanation": "focus-within соответствует элементу, если он сам или любой его потомок имеет фокус. Это удобно для визуального выделения группы label, input и подсказки. Отдельный заметный фокус самого управления всё равно должен быть понятным.", "code": "", "example": ""}, {"id": "c080", "subject": "CSS", "topic": "Размеры и единицы", "level": 2, "prompt": "От чего зависит процентный padding-top у обычного блока в горизонтальном режиме письма?", "options": ["От ширины содержащего блока", "Всегда от высоты самого элемента", "От font-size родителя", "От высоты viewport"], "explanation": "В традиционной блочной раскладке процентные padding, включая вертикальные, вычисляются относительно ширины содержащего блока. Это часто неожиданно. Для задания пропорций изображения теперь понятнее использовать aspect-ratio.", "code": "", "example": ""}, {"id": "c081", "subject": "CSS", "topic": "Изображения и оформление", "level": 1, "prompt": "Чем background-image отличается от img с alt для смысловой фотографии?", "options": ["CSS-фон не предоставляет alt и обычно предназначен для оформления", "CSS-фон автоматически читает имя файла скринридеру", "img нельзя адаптировать через CSS", "CSS-фон всегда меньше по размеру файла"], "explanation": "Важное изображение должно иметь доступный текстовый эквивалент. img с содержательным alt удобен для фотографии достопримечательности. Фон подходит для декоративных деталей, когда смысл не теряется при его отсутствии.", "code": "", "example": ""}, {"id": "c082", "subject": "CSS", "topic": "Позиционирование", "level": 2, "prompt": "Как сделать подпись поверх фотографии, не вынимая всю карточку из обычного потока?", "options": ["Relative у рамки фото, absolute у подписи", "Absolute у body и каждого раздела", "Fixed у каждой фотографии", "Float: overlay у текста"], "explanation": "Локальное позиционирование сохраняет нормальную раскладку страницы. Контейнер изображения резервирует место, а подпись позиционируется внутри него. Проверь контраст подписи, например на затемнённой подложке.", "code": "", "example": ""}, {"id": "c083", "subject": "CSS", "topic": "Каскад и наследование", "level": 2, "prompt": "Как сделать элементы формы наследующими шрифт страницы?", "options": ["input, button, select, textarea { font: inherit; }", "form { font-type: parent; }", "body { input-font: inherit; }", "input { font-family: auto-page; }"], "explanation": "Некоторые элементы формы имеют браузерные шрифтовые настройки. font: inherit наследует шрифтовую группу от родителя и помогает согласовать интерфейс. После сбросов не забывай состояние фокуса и удобные размеры элементов.", "code": "", "example": ""}, {"id": "c084", "subject": "CSS", "topic": "Grid", "level": 2, "prompt": "Чем gap отличается от margin отдельных карточек?", "options": ["gap задаёт интервалы между треками или элементами контейнера, без внешнего отступа по его краям", "gap всегда добавляет рамку вокруг контейнера", "gap доступен только для таблиц", "gap меняет порядок DOM"], "explanation": "gap работает в Grid и Flexbox и помогает задавать одинаковое расстояние между элементами. Он не создаёт внешний отступ по краям сетки: для него нужен padding контейнера или другие размеры. Поэтому обычно не требуется убирать margin у последней карточки.", "code": "", "example": ""}, {"id": "c085", "subject": "CSS", "topic": "Размеры и единицы", "level": 2, "prompt": "Когда 100vw может вызвать горизонтальное переполнение по сравнению с width: 100%?", "options": ["Когда ширина viewport-единицы включает область вертикальной полосы прокрутки", "Когда font-size больше 16px в любом браузере", "Только когда страница не имеет изображений", "Никогда: 100vw и 100% всегда полностью эквивалентны"], "explanation": "Viewport-единицы и проценты имеют разные базы расчёта. При обычной вертикальной полосе прокрутки 100vw может оказаться шире доступной области содержимого. Для обычных блоков часто достаточно width: 100% или автоматической ширины.", "code": "", "example": ""}, {"id": "c086", "subject": "CSS", "topic": "Анимации", "level": 2, "prompt": "Как задать три состояния циклической CSS-анимации?", "options": ["Через @keyframes с 0%, 50%, 100% и animation с infinite", "Через три hover подряд у одного селектора", "Через display: 0%, 50%, 100%", "Через три одинаковых id на странице"], "explanation": "Keyframes описывает значения свойств в разные моменты цикла. infinite повторяет анимацию. В критериях упомянуты минимум три состояния объекта или цикличность; при этом движение должно оставаться умеренным и учитывать reduced motion.", "code": "", "example": "@keyframes pulse {\n  0%, 100% { transform: scale(1); }\n  50% { transform: scale(1.04); }\n}\n.marker { animation: pulse 3s ease-in-out infinite; }"}, {"id": "c087", "subject": "CSS", "topic": "Печать", "level": 2, "prompt": "Достаточно ли скрыть header и footer для выполнения задания печати страницы достопримечательности?", "options": ["Нет, нужно также оставить нужный контент, убрать лишнее, показать приветствие и сделать изображение серым", "Да, остальные требования относятся только к экрану", "Да, если использовать тёмную тему", "Нет, обязательно нужен JavaScript window.print()"], "explanation": "Задание описывает итог печати: название, чёрно-белое изображение и приветственный заголовок, без лишних блоков. Поэтому проверь описания, комментарии, форму и другие секции, а не только шапку и подвал. Печать запускается средствами браузера без JS.", "code": "", "example": ""}, {"id": "c088", "subject": "CSS", "topic": "Доступность и качество", "level": 2, "prompt": "Как лучше сверять форму с предоставленным макетом?", "options": ["Сопоставить размеры, интервалы, типографику, цвета и состояния при нужной ширине", "Заменить форму скриншотом макета", "Проверить только число полей без внешнего вида", "Проверить только красивый фон"], "explanation": "Требуется настоящая вёрстка формы с соответствием макету, а фрагменты скриншотов запрещены. Сравнивай контейнер, сетку, размеры полей, шрифт, отступы и элементы оформления. Сохраняй семантику label и доступные состояния при визуальной точности.", "code": "", "example": ""}]</script>
<script>
'use strict';
const BANK=JSON.parse(document.getElementById('question-bank').textContent);
const BY_ID=new Map(BANK.map(q=>[q.id,q]));
const KEY='professionals-html-css-trainer-v1';
const VERSION=1;
const LEVELS={1:'Основы',2:'Применение'};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const emptyState=()=>({version:VERSION,history:{},bookmarks:[],session:null,theme:'light'});
let state=emptyState(),storageOK=true,view='home',choice=null,libraryPage=0;
let filters={subject:'Все',topics:[],mode:'all',level:'all',count:'20',shuffle:true};
let libFilters={subject:'Все',topic:'Все',search:''};
function validSession(s){return s&&Array.isArray(s.ids)&&s.ids.length>0&&new Set(s.ids).size===s.ids.length&&s.ids.every(id=>BY_ID.has(id))&&Number.isInteger(s.pos)&&s.pos>=0&&s.pos<s.ids.length&&s.orders&&s.answers&&s.ids.every(id=>Array.isArray(s.orders[id])&&s.orders[id].length===4&&[0,1,2,3].every(n=>s.orders[id].includes(n))&&(s.answers[id]===undefined||(Number.isInteger(s.answers[id])&&s.answers[id]>=0&&s.answers[id]<4)));}
function normalize(raw){if(!raw||raw.version!==VERSION)throw new Error('Неподходящий формат прогресса.');const clean=emptyState();clean.theme=raw.theme==='dark'?'dark':'light';clean.bookmarks=Array.isArray(raw.bookmarks)?[...new Set(raw.bookmarks.filter(id=>BY_ID.has(id)))]:[];for(const [id,h] of Object.entries(raw.history||{})){if(BY_ID.has(id)&&h&&Number.isInteger(h.attempts)&&h.attempts>0&&Number.isInteger(h.right)&&h.right>=0&&h.right<=h.attempts&&typeof h.last==='boolean'){clean.history[id]={attempts:h.attempts,right:h.right,last:h.last};}}clean.session=validSession(raw.session)?raw.session:null;return clean;}
try{const raw=localStorage.getItem(KEY);if(raw)state=normalize(JSON.parse(raw));}catch(e){storageOK=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function progress(){const vals=Object.values(state.history);return {seen:vals.length,known:vals.filter(h=>h.last).length,wrong:vals.filter(h=>!h.last).length,attempts:vals.reduce((n,h)=>n+h.attempts,0),right:vals.reduce((n,h)=>n+h.right,0)};}

function statsHTML(){const p=progress();return `<div class="stats"><div class="stat"><strong>${p.seen}<span> / ${BANK.length}</span></strong><span>Вопросов пройдено</span></div><div class="stat"><strong>${p.known}</strong><span>Последний ответ верный</span></div><div class="stat"><strong>${p.wrong}</strong><span>Нужно повторить</span></div><div class="stat"><strong>${p.attempts?Math.round(p.right/p.attempts*100):0}%</strong><span>Верных за все попытки</span></div></div>`;}

function start(qs,forceAll=false){if(!qs.length)return;let ids=qs.map(q=>q.id);if(filters.shuffle)ids=shuffle(ids);if(!forceAll&&filters.count!=='all')ids=ids.slice(0,Number(filters.count));const orders={};ids.forEach(id=>orders[id]=shuffle([0,1,2,3]));state.session={ids,pos:0,answers:{},orders};choice=null;save();showQuiz();window.scrollTo(0,0);}

d="bookmark" class="small" aria-pressed="${bookmarked(q.id)}">${bookmarked(q.id)?'★ В закладках':'☆ В закладки'}</button><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="back" class="small" ${s.pos===0?'disabled':''}>Назад</button>${answered?`<button id="next" class="primary">${s.pos===s.ids.length-1?'К результатам':'Дальше →'}</button>`:'<button id="check" class="primary" '+(choice===null?'disabled':'')+'>Проверить</button><button id="skip" class="small">Пропустить</button>'}</div></div></section><aside class="panel"><h3>Маршрут подхода</h3><p class="tiny muted" style="margin-top:7px">Можно вернуться к любому вопросу. Первый ответ в подходе фиксируется.</p><div class="map">${s.ids.map((id,i)=>{const a=s.answers[id],done=a!==undefined;return `<button data-jump="${i}" class="${i===s.pos?'current ':''}${done?(a===0?'right':'wrong'):''}" ${i===s.pos?'aria-current="step"':''} aria-label="Вопрос ${i+1}: ${done?(a===0?'верно':'ошибка'):'без ответа'}">${i+1}${done?(a===0?' ✓':' ×'):''}</button>`;}).join('')}</div><div class="legend"><em class="right-text">✓ Верно</em><em class="wrong-text">× Ошибка</em><em>Число — без ответа</em></div><p class="note">Пропуск не считается ошибкой, но вопрос останется непройденным. Исправить результат можно в новом подходе.</p></aside></div>`;

function check(){const s=state.session;if(!s||choice===null)return;const id=s.ids[s.pos];if(s.answers[id]!==undefined)return;s.answers[id]=choice;const h=state.history[id]||{attempts:0,right:0,last:false};h.attempts++;h.last=choice===0;if(h.last)h.right++;state.history[id]=h;save();showQuiz();$('#next')?.focus({preventScroll:true});}
function jump(pos){if(pos<0||pos>=state.session.ids.length)return;state.session.pos=pos;choice=null;save();showQuiz();$('#question-title').focus({preventScroll:true});window.scrollTo(0,0);}
function next(){const s=state.session;if(s.pos===s.ids.length-1)results();else jump(s.pos+1);}
function results(){if(!state.session){setView('home');return;}view='results';nav();const s=state.session,answered=s.ids.filter(id=>s.answers[id]!==undefined),right=answered.filter(id=>s.answers[id]===0),wrong=answered.filter(id=>s.answers[id]!==0),unseen=s.ids.filter(id=>s.answers[id]===undefined),rows={};for(const id of s.ids){const q=BY_ID.get(id),key=q.subject+' · '+q.topic;if(!rows[key])rows[key]={total:0,done:0,right:0};rows[key].total++;if(s.answers[id]!==undefined){rows[key].done++;if(s.answers[id]===0)rows[key].right++;}}const percent=answered.length?Math.round(right.length/answered.length*100):0;

function entry(q,answer){return `<details class="panel library-item"><summary>${esc(q.id.toUpperCase()+' · '+q.prompt)}</summary><div class="entry-body"><div class="tags"><span class="tag subject">${q.subject}</span><span class="tag">${esc(q.topic)}</span><span class="tag">${LEVELS[q.level]}</span></div>${q.code?`<pre><code>${esc(q.code)}</code></pre>`:''}${answer!==undefined?`<p class="wrong-text"><strong>Твой ответ:</strong> ${esc(q.options[answer])}</p>`:''}<p class="right-text"><strong>Правильно:</strong> ${esc(q.options[0])}</p><p>${esc(q.explanation)}</p>${q.example?`<pre><code>${esc(q.example)}</code></pre>`:''}<button class="small" data-book="${q.id}" aria-pressed="${bookmarked(q.id)}">${bookmarked(q.id)?'★ В закладках':'☆ В закладки'}</button></div></details>`;}

function library(){view='library';nav();const topics=[...new Set(BANK.filter(q=>libFilters.subject==='Все'||q.subject===libFilters.subject).map(q=>q.topic))];$('#app').innerHTML=`${warning()}<div class="eyebrow">Ответы и объяснения</div><h1>Справочник по темам</h1><p class="lead">Здесь ответы открываются сразу по нажатию на вопрос. Для проверки знаний вернись в тренировку.</p><div class="library-controls"><div><label class="field-label" for="search">Найти понятие или фрагмент кода</label><input id="search" type="search" placeholder="Например: box-sizing, label, печать" value="${esc(libFilters.search)}"></div><div><label class="field-label" for="lib-subject">Предмет</label><select id="lib-subject"><option>Все</option><option>HTML</option><option>CSS</option></select></div><div><label class="field-label" for="lib-topic">Тема</label><select id="lib-topic"><option>Все</option>${topics.map(t=>`<option>${esc(t)}</option>`).join('')}</select></div></div><div id="entries"></div><section class="panel" style="margin-top:28px"><h2>Источники и границы теста</h2><p class="note">Вопросы написаны для подготовки по конкурсному заданию «Веб-технологии» 2027, модуль А, и файлу критериев оценки. Это широкий учебный набор, а не исчерпывающий справочник по всем возможностям HTML и CSS и не официальный экзамен.</p><p class="note">Документация для углубления (интернет нужен только для перехода): <a href="https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content" target="_blank" rel="noopener noreferrer">HTML на MDN</a>, <a href="https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Styling_basics" target="_blank" rel="noopener noreferrer">основы CSS</a>, <a href="https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/CSS_layout" target="_blank" rel="noopener noreferrer">раскладка CSS</a>, <a href="https://html.spec.whatwg.org/" target="_blank" rel="noopener noreferrer">стандарт HTML</a>.</p><p class="note">В источниках конкурса есть $('#lib-subject').value=libFilters.subject;$('#lib-topic').value=libFilters.topic;$('#search').oninput=e=>{libFilters.search=e.target.value;libraryPage=0;renderEntries();};$('#lib-subject').onchange=e=>{libFilters.subject=e.target.value;libFilters.topic='Все';libraryPage=0;library();};$('#lib-topic').onchange=e=>{libFilters.topic=e.target.value;libraryPage=0;renderEntries();};renderEntries();}
function renderEntries(){const term=libFilters.search.trim().toLocaleLowerCase('ru'),items=BANK.filter(q=>(libFilters.subject==='Все'||q.subject===libFilters.subject)&&(libFilters.topic==='Все'||q.topic===libFilters.topic)&&(!term||[q.prompt,q.topic,q.explanation,q.code,q.example,...q.options].join(' ').toLocaleLowerCase('ru').includes(term)));const pages=Math.max(1,Math.ceil(items.length/12));libraryPage=Math.min(libraryPage,pages-1);$('#entries').innerHTML=`<p class="tiny muted" style="margin-bottom:15px">Найдено: ${items.length} · Страница ${libraryPage+1} из ${pages}</p>${items.length?items.slice(libraryPage*12,(libraryPage+1)*12).map(q=>entry(q)).join(''):'<div class="empty">Ничего не найдено. Попробуй другой запрос.</div>'}${pages>1?`<div class="actions"><button id="lib-prev" ${libraryPage===0?'disabled':''}>← Назад</button><button id="lib-next" ${libraryPage===pages-1?'disabled':''}>Дальше →</button></div>`:''}`;bindEntryButtons();$('#lib-prev')?.addEventListener('click',()=>{libraryPage--;renderEntries();});$('#lib-next')?.addEventListener('click',()=>{libraryPage++;renderEntries();});}
function stats(){view='stats';nav();const p=progress(),topics={};for(const q of BANK){const k=q.subject+' · '+q.topic;if(!topics[k])topics[k]={total:0,seen:0,known:0};topics[k].total++;if(state.history[q.id]){topics[k].seen++;if(state.history[q.id].last)topics[k].known++;}}$('#app').innerHTML=`${warning()}<div class="eyebrow">Твоя подготовка</div><h1>Видеть пробелы.<br>Замечать продвижение.</h1><p class="lead">«Верно» по теме — число вопросов с последним правильным ответом. Общая точность учитывает все попытки, включая повторения.</p><div style="margin-top:25px">${statsHTML()}</div><section class="panel"><h2>Сохранение и повторение</h2><p class="note">Прогресс сохраняется в этом браузере, если он разрешает локальное хранилище для файла. При переносе или переименовании HTML-файла, очистке данных либо в приватном режиме сохранение может потеряться. Скачай резервную копию перед переносом.</p><div class="actions"><button id="do-errors" class="primary" ${p.wrong?'':'disabled'}>Повторить последние ошибки (${p.wrong})</button><button id="do-books" ${state.bookmarks.length?'':'disabled'}>Закладки (${state.bookmarks.length})</button><button id="export">Скачать прогресс</button><button id="import">Загрузить прогресс</button><input id="import-file" type="file" accept=".json,application/json" hidden></div><p id="import-note" class="note" role="status"></p><details style="margin-top:20px"><summary class="tiny muted">Сбросить все результаты</summary><p class="note">Удалятся ответы, закладки и текущий подход только в этом браузере.</p><button id="reset" class="small" style="margin-top:10px;color:var(--bad)">Сбросить прогресс…</button></details></section><section class="panel" style="margin-top:24px"><h2>Карта знаний</h2><div class="table-wrap"><table><thead><tr><th scope="col">Тема</th><th scope="col">Пройдено</th><th scope="col">Последний ответ верный</th></tr></thead><tbody>${Object.entries(topics).map(([t,r])=>`<tr><th scope="row">${esc(t)}</th><td>${r.seen} / ${r.total}</td><td>${r.known} / ${r.total}</td></tr>`).join('')}</tbody></table></div></section>`;
$('#do-errors').onclick=()=>start(BANK.filter(q=>state.history[q.id]?.last===false),true);$('#do-books').onclick=()=>start(BANK.filter(q=>bookmarked(q.id)),true);$('#export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='html-css-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};$('#import').onclick=()=>$('#import-file').click();$('#import-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2*1024*1024)throw new Error('Слишком большой файл.');const loaded=normalize(JSON.parse(await file.text()));if(!confirm('Заменить текущий прогресс данными из выбранного файла?'))return;state=loaded;save();applyTheme();stats();$('#import-note').textContent='Прогресс загружен.';}catch(err){$('#import-note').textContent='Не удалось загрузить прогресс: проверь JSON-файл, выгруженный этим тренажёром.';}};$('#reset').onclick=()=>{if(!confirm('Удалить все ответы, закладки и текущий подход? Действие нельзя отменить без резервной копии.'))return;const theme=state.theme;state=emptyState();state.theme=theme;save();stats();};}
function applyTheme(){document.documentElement.dataset.theme=state.theme;$('#theme').textContent=state.theme==='dark'?'Светлая тема':'Тёмная тема';}
function nav(){document.querySelectorAll('[data-view]').forEach(b=>{if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});}
function setView(v){choice=null;view=v;nav();if(v==='home')home();else if(v==='library')library();else stats();window.scrollTo(0,0);}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('#theme').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';save();applyTheme();};
document.addEventListener('keydown',e=>{if(view!=='quiz'||e.ctrlKey||e.altKey||e.metaKey||e.repeat)return;const tag=e.target.tagName;if(['INPUT','SELECT','TEXTAREA'].includes(tag))return;if(['1','2','3','4'].includes(e.key)){const b=document.querySelectorAll('[data-option]')[Number(e.key)-1];if(b&&!b.disabled){e.preventDefault();b.click();}}else if(e.key==='Enter'&&(e.target.matches('[data-option]')||(tag!=='BUTTON'&&tag!=='A'&&tag!=='SUMMARY'))){const b=$('#check')||$('#next');if(b&&!b.disabled){e.preventDefault();b.click();}}});
applyTheme();home();
</script>
